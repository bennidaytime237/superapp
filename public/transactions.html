<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script>
(function(){var t=localStorage.getItem('sage-theme')||(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.className=t;})();
</script>
<title>Transactions - Sage</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="theme.css"/>
<script>
tailwind.config = {
  darkMode: "class",
  theme: {
    extend: {
      colors: {
        "surface-bright":"var(--surface-bright)","surface":"var(--surface)","background":"var(--background)",
        "surface-container-lowest":"var(--surface-container-lowest)","surface-container-low":"var(--surface-container-low)",
        "surface-container":"var(--surface-container)","surface-container-high":"var(--surface-container-high)",
        "surface-container-highest":"var(--surface-container-highest)","surface-dim":"var(--surface-dim)",
        "surface-variant":"var(--surface-variant)","surface-tint":"var(--surface-tint)",
        "primary":"var(--primary)","primary-dim":"var(--primary-dim)","primary-fixed":"var(--primary-fixed)",
        "primary-fixed-dim":"var(--primary-fixed-dim)","primary-container":"var(--primary-container)",
        "on-primary":"var(--on-primary)","on-primary-container":"var(--on-primary-container)",
        "on-primary-fixed":"var(--on-primary-fixed)","on-primary-fixed-variant":"var(--on-primary-fixed-variant)",
        "on-surface":"var(--on-surface)","on-surface-variant":"var(--on-surface-variant)",
        "on-background":"var(--on-background)",
        "outline":"var(--outline)","outline-variant":"var(--outline-variant)",
        "error":"var(--error)","error-container":"var(--error-container)",
        "on-error":"var(--on-error)","on-error-container":"var(--on-error-container)",
        "inverse-surface":"var(--inverse-surface)","inverse-on-surface":"var(--inverse-on-surface)",
        "inverse-primary":"var(--inverse-primary)",
        "secondary":"var(--secondary)","secondary-container":"var(--secondary-container)",
        "on-secondary":"var(--on-secondary)","on-secondary-container":"var(--on-secondary-container)",
        "tertiary":"var(--tertiary)","tertiary-container":"var(--tertiary-container)",
        "on-tertiary":"var(--on-tertiary)","on-tertiary-container":"var(--on-tertiary-container)",
        "sage-peach":"var(--sage-peach)","sage-peach-light":"var(--sage-peach-light)",
      },
      fontFamily: { "headline":["Outfit"],"body":["Outfit"],"label":["Outfit"] },
      borderRadius: { "DEFAULT":"1rem","lg":"2rem","xl":"3rem","full":"9999px" },
    },
  },
}
</script>
<style>
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
  body { font-family: 'Outfit', sans-serif; }
  b, strong, .font-bold, .font-extrabold, .font-black, .font-semibold { letter-spacing: 0.01em; }
</style>
<script src="theme.js"></script>
</head>
<body class="bg-surface text-on-surface min-h-screen">

<!-- Sidebar -->
<aside class="hidden md:flex flex-col fixed left-0 top-0 h-full w-64 p-4 bg-surface-container-low z-40">
  <a href="index.html" class="mb-10 px-4 py-2 flex items-center gap-2">
    <img src="sage-wordmark.svg" alt="Sage" class="h-7"/>
  </a>
  <nav class="flex-1 space-y-1">
    <a class="flex items-center gap-3 px-4 py-3 text-on-surface-variant hover:text-primary hover:bg-white/50 rounded-full transition-all" href="index.html">
      <span class="material-symbols-outlined">grid_view</span>
      <span class="font-medium text-sm">Dashboard</span>
    </a>
    <a class="flex items-center gap-3 px-4 py-3 text-on-surface-variant hover:text-primary hover:bg-white/50 rounded-full transition-all" href="swap.html">
      <span class="material-symbols-outlined">swap_horiz</span>
      <span class="font-medium text-sm">Bridge</span>
    </a>
    <a class="flex items-center gap-3 px-4 py-3 bg-surface-container-lowest text-primary rounded-full shadow-sm" href="transactions.html">
      <span class="material-symbols-outlined">receipt_long</span>
      <span class="font-medium text-sm">Transactions</span>
    </a>
    <a class="flex items-center gap-3 px-4 py-3 text-on-surface-variant hover:text-primary hover:bg-white/50 rounded-full transition-all" href="gas.html">
      <span class="material-symbols-outlined">local_gas_station</span>
      <span class="font-medium text-sm">Gas</span>
    </a>
  </nav>
</aside>

<!-- Main -->
<main class="md:ml-64 min-h-screen pb-24 md:pb-8">
  <header class="flex justify-between items-center w-full px-6 py-4 bg-surface sticky top-0 z-30">
    <div class="flex items-center gap-2">
      <a href="index.html"><img src="sage-wordmark.svg" alt="Sage" class="h-6 md:hidden"/></a>
      <h2 class="hidden md:block font-headline font-bold text-xl tracking-tight text-on-background">Transactions</h2>
    </div>
    <div class="flex items-center gap-3">
      <a href="index.html" class="md:hidden text-sm font-medium text-on-surface-variant hover:text-primary flex items-center gap-1">
        <span class="material-symbols-outlined text-sm">arrow_back</span> Back
      </a>
    <button onclick="toggleTheme()" class="flex items-center justify-center w-9 h-9 rounded-full text-on-surface-variant hover:text-primary hover:bg-surface-container transition-all flex-shrink-0">
      <span class="material-symbols-outlined text-lg theme-toggle-icon">dark_mode</span>
    </button>
      <button id="connect-btn" onclick="connectWallet()" class="flex items-center gap-2 px-3 py-1.5 bg-primary text-on-primary rounded-full text-xs font-bold active:scale-95 transition-transform">
        <span class="material-symbols-outlined text-sm">account_balance_wallet</span>
        <span id="connect-label">Connect</span>
      </button>
    </div>
  </header>

  <div class="px-6 lg:px-10 py-6 max-w-3xl">
    <!-- Search + Filters -->
    <div class="flex flex-wrap gap-2 mb-6 items-center">
      <input id="search-input" type="text" placeholder="Search token, chain, address..." oninput="render()" class="flex-1 min-w-[180px] px-4 py-2 rounded-full text-sm border border-outline-variant/15 bg-surface-container-lowest focus:outline-none focus:ring-2 focus:ring-primary/30 placeholder:text-on-surface-variant/40"/>
      <div class="relative" id="dd-chain">
        <button onclick="toggleDrop('chain')" class="flex items-center gap-1.5 px-4 py-2 rounded-full text-sm font-bold bg-surface-container-low text-on-surface-variant hover:bg-surface-container-high transition-colors">
          <span id="dd-chain-label">All chains</span>
          <span class="material-symbols-outlined text-sm">expand_more</span>
        </button>
        <div id="dd-chain-menu" class="hidden absolute left-0 top-full mt-1 bg-white rounded-lg shadow-lg border border-outline-variant/10 z-50 min-w-[160px] max-h-[240px] overflow-y-auto py-1"></div>
      </div>
      <div class="relative" id="dd-token">
        <button onclick="toggleDrop('token')" class="flex items-center gap-1.5 px-4 py-2 rounded-full text-sm font-bold bg-surface-container-low text-on-surface-variant hover:bg-surface-container-high transition-colors">
          <span id="dd-token-label">All tokens</span>
          <span class="material-symbols-outlined text-sm">expand_more</span>
        </button>
        <div id="dd-token-menu" class="hidden absolute left-0 top-full mt-1 bg-white rounded-lg shadow-lg border border-outline-variant/10 z-50 min-w-[160px] max-h-[240px] overflow-y-auto py-1"></div>
      </div>
      <div class="relative" id="dd-status">
        <button onclick="toggleDrop('status')" class="flex items-center gap-1.5 px-4 py-2 rounded-full text-sm font-bold bg-surface-container-low text-on-surface-variant hover:bg-surface-container-high transition-colors">
          <span id="dd-status-label">All status</span>
          <span class="material-symbols-outlined text-sm">expand_more</span>
        </button>
        <div id="dd-status-menu" class="hidden absolute left-0 top-full mt-1 bg-white rounded-lg shadow-lg border border-outline-variant/10 z-50 min-w-[140px] py-1"></div>
      </div>
    </div>

    <!-- Transaction list -->
    <div id="tx-list"></div>
  </div>
</main>

<!-- Mobile nav -->
<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center px-4 pb-6 md:hidden bg-surface/70 backdrop-blur-xl shadow-[0_-4px_40px_rgba(42,52,52,0.04)] rounded-t-3xl">
  <a class="flex flex-col items-center justify-center text-on-surface-variant p-3 active:scale-90" href="index.html">
    <span class="material-symbols-outlined">home</span>
    <span class="font-headline text-[10px] font-bold uppercase mt-1">Home</span>
  </a>
  <a class="flex flex-col items-center justify-center text-on-surface-variant p-3 active:scale-90" href="swap.html">
    <span class="material-symbols-outlined">swap_horiz</span>
    <span class="font-headline text-[10px] font-bold uppercase mt-1">Bridge</span>
  </a>
  <a class="flex flex-col items-center justify-center bg-primary-container text-primary rounded-full p-3 active:scale-90" href="transactions.html">
    <span class="material-symbols-outlined">receipt_long</span>
    <span class="font-headline text-[10px] font-bold uppercase mt-1">History</span>
  </a>
</nav>

<script>
let walletAddress = null;
let txData = [];
let visibleCount = 10;
const PAGE_SIZE = 10;

const selected = { chain: new Set(), token: new Set(), status: new Set() };
let allChains = [], allTokens = [];

function populateFilters() {
  const chains = new Set();
  const tokens = new Set();
  txData.forEach(tx => {
    if (tx.fromChain) chains.add(tx.fromChain);
    if (tx.toChain) chains.add(tx.toChain);
    if (tx.fromToken) tokens.add(tx.fromToken);
    if (tx.toToken) tokens.add(tx.toToken);
  });
  allChains = [...chains].sort();
  allTokens = [...tokens].sort();
  renderDropdown('chain', allChains);
  renderDropdown('token', allTokens);
  renderDropdown('status', ['filled', 'pending']);
}

function renderDropdown(key, options) {
  const menu = document.getElementById(`dd-${key}-menu`);
  menu.innerHTML = options.map(o => {
    const checked = selected[key].has(o);
    return `<label class="flex items-center gap-2 px-3 py-2 hover:bg-surface-container-low cursor-pointer transition-colors text-sm">
      <input type="checkbox" ${checked ? 'checked' : ''} onchange="toggleFilter('${key}','${o}')" class="rounded border-outline-variant/30 text-primary focus:ring-primary/30"/>
      <span class="text-on-surface">${o}</span>
    </label>`;
  }).join('');
  updateLabel(key);
}

function toggleFilter(key, value) {
  if (selected[key].has(value)) selected[key].delete(value);
  else selected[key].add(value);
  updateLabel(key);
  render();
}

function updateLabel(key) {
  const label = document.getElementById(`dd-${key}-label`);
  const btn = label.parentElement;
  const count = selected[key].size;
  const defaults = { chain: 'All chains', token: 'All tokens', status: 'All status' };
  if (count === 0) {
    label.textContent = defaults[key];
    btn.className = 'flex items-center gap-1.5 px-4 py-2 rounded-full text-sm font-bold bg-surface-container-low text-on-surface-variant hover:bg-surface-container-high transition-colors';
  } else if (count === 1) {
    label.textContent = [...selected[key]][0];
    btn.className = 'flex items-center gap-1.5 px-4 py-2 rounded-full text-sm font-bold bg-primary text-on-primary transition-colors';
  } else {
    label.textContent = `${count} selected`;
    btn.className = 'flex items-center gap-1.5 px-4 py-2 rounded-full text-sm font-bold bg-primary text-on-primary transition-colors';
  }
}

function toggleDrop(key) {
  const menu = document.getElementById(`dd-${key}-menu`);
  const wasHidden = menu.classList.contains('hidden');
  // Close all
  ['chain','token','status'].forEach(k => document.getElementById(`dd-${k}-menu`).classList.add('hidden'));
  if (wasHidden) {
    menu.classList.remove('hidden');
    setTimeout(() => document.addEventListener('click', function close(e) {
      if (!document.getElementById(`dd-${key}`).contains(e.target)) {
        menu.classList.add('hidden');
        document.removeEventListener('click', close);
      }
    }), 0);
  }
}

function resolveWalletENS(){if(!walletAddress)return;fetch(`/api/ens?address=${walletAddress}`).then(r=>r.json()).then(d=>{if(d.name)document.getElementById('connect-label').textContent=d.name;}).catch(()=>{});}
function updateConnectBtn() {
  const label = document.getElementById('connect-label');
  const btn = document.getElementById('connect-btn');
  if (walletAddress) {
    label.textContent = walletAddress.slice(0,6) + '...' + walletAddress.slice(-4);
    resolveWalletENS();
    btn.className = 'flex items-center gap-2 px-3 py-1.5 bg-surface-container-high text-on-surface rounded-full text-xs font-bold active:scale-95 transition-transform';
  } else {
    label.textContent = 'Connect';
    btn.className = 'flex items-center gap-2 px-3 py-1.5 bg-primary text-on-primary rounded-full text-xs font-bold active:scale-95 transition-transform';
  }
}

async function connectWallet() {
  if (!window.ethereum) { alert('Install MetaMask'); return; }
  const accs = await window.ethereum.request({ method:'eth_requestAccounts' });
  walletAddress = accs[0];
  updateConnectBtn();
  await loadTransactions();
}

async function initWallet() {
  if (window.ethereum) {
    const accs = await window.ethereum.request({ method:'eth_accounts' });
    if (accs.length > 0) {
      walletAddress = accs[0];
      updateConnectBtn();
      await loadTransactions();
    } else {
      showEmpty('Connect wallet to view transactions');
    }
    window.ethereum.on('accountsChanged', async (accs) => {
      walletAddress = accs[0] || null;
      updateConnectBtn();
      if (walletAddress) await loadTransactions();
      else { txData = []; showEmpty('Connect wallet to view transactions'); }
    });
  } else {
    showEmpty('Install MetaMask to view transactions');
  }
}

function showEmpty(msg) {
  document.getElementById('tx-list').innerHTML = `<div class="text-center py-16">
    <span class="material-symbols-outlined text-5xl text-on-surface-variant/20 mb-3">receipt_long</span>
    <p class="text-on-surface-variant">${msg}</p>
    <a href="swap.html" class="inline-block mt-4 px-6 py-3 bg-primary text-on-primary rounded-full font-bold text-sm">Make your first bridge</a>
  </div>`;
}

function cacheKey() { return 'sage_txcache_' + (walletAddress||'').toLowerCase(); }

async function loadTransactions() {
  visibleCount = PAGE_SIZE;
  const list = document.getElementById('tx-list');

  // Show cached data instantly
  try {
    const cached = JSON.parse(localStorage.getItem(cacheKey()) || 'null');
    if (cached && cached.length > 0) {
      txData = cached;
      populateFilters();
      render();
    } else {
      list.innerHTML = '<div class="flex items-center justify-center gap-2 py-16 text-sm text-on-surface-variant"><div class="w-4 h-4 rounded-full border-2 border-primary border-t-transparent animate-spin"></div>Loading transactions...</div>';
    }
  } catch { /* no cache */ }

  // Fetch fresh in background
  try {
    const res = await fetch(`/api/transactions?address=${walletAddress}`);
    const data = await res.json();
    txData = data.deposits || [];
    try { localStorage.setItem(cacheKey(), JSON.stringify(txData)); } catch {}
    populateFilters();
    render();
  } catch (e) {
    console.error('Failed to load transactions:', e);
    if (!txData.length) {
      list.innerHTML = '<div class="text-center py-16"><p class="text-on-surface-variant">Failed to load transactions</p><button onclick="loadTransactions()" class="mt-4 px-6 py-3 bg-primary text-on-primary rounded-full font-bold text-sm">Retry</button></div>';
    }
  }
}

function showMore() {
  visibleCount += PAGE_SIZE;
  render(false);
}

const EXP = {
  1:'https://etherscan.io/tx/',42161:'https://arbiscan.io/tx/',8453:'https://basescan.org/tx/',
  10:'https://optimistic.etherscan.io/tx/',137:'https://polygonscan.com/tx/',324:'https://explorer.zksync.io/tx/',
  59144:'https://lineascan.build/tx/',34443:'https://explorer.mode.network/tx/',81457:'https://blastscan.io/tx/',
  534352:'https://scrollscan.com/tx/',7777777:'https://explorer.zora.energy/tx/',
};

function shortAddr(a) { return a ? a.slice(0,6)+'…'+a.slice(-4) : '--'; }

function render(resetPage) {
  if (resetPage !== false) visibleCount = PAGE_SIZE;
  const list = document.getElementById('tx-list');
  const q = (document.getElementById('search-input').value || '').toLowerCase().trim();

  let history = txData.filter(tx => {
    if (selected.chain.size && !selected.chain.has(tx.fromChain) && !selected.chain.has(tx.toChain)) return false;
    if (selected.token.size && !selected.token.has(tx.fromToken) && !selected.token.has(tx.toToken)) return false;
    if (selected.status.size && !selected.status.has(tx.status)) return false;
    if (q) {
      const hay = `${tx.fromToken} ${tx.toToken} ${tx.fromChain} ${tx.toChain} ${tx.recipient||''} ${tx.depositor||''} ${tx.depositTxHash||''} ${tx.amount} ${tx.outputAmount||''}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  if (history.length === 0) {
    showEmpty('No transactions yet');
    return;
  }

  const cards = history.map(tx => {
    const date = new Date(tx.timestamp);
    const dateStr = date.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
    const timeStr = date.toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit' });

    const depositUrl = tx.depositTxHash && tx.fromChainId ? (EXP[tx.fromChainId] || 'https://etherscan.io/tx/') + tx.depositTxHash : null;
    const fillUrl = tx.fillTxHash && tx.toChainId ? (EXP[tx.toChainId] || 'https://etherscan.io/tx/') + tx.fillTxHash : null;

    // Status + fill time
    let statusHtml = '';
    if (tx.status === 'filled') {
      const dur = tx.fillDuration;
      statusHtml = `<span class="text-[10px] font-bold text-primary bg-primary-container px-2 py-0.5 rounded-full">Filled${dur ? ' · ' + (dur < 60 ? dur + 's' : Math.floor(dur/60) + 'm ' + (dur%60) + 's') : ''}</span>`;
    } else if (tx.status === 'pending') {
      statusHtml = '<span class="text-[10px] font-bold text-amber-600 bg-amber-100 px-2 py-0.5 rounded-full">Pending</span>';
    }

    // Sage badge
    const sageBadge = tx.isSage ? '<span class="text-[10px] font-bold text-on-primary bg-primary px-2 py-0.5 rounded-full">Sage</span>' : '';

    // Recipient display
    const recipientShort = shortAddr(tx.recipient);
    const isHL = tx.toChain === 'Hyperliquid';
    const recipientLabel = isHL ? 'Hyperliquid Bridge2' : recipientShort;

    // Net fee from API
    const feeHtml = tx.totalFeeUsd ? `$${parseFloat(tx.totalFeeUsd).toFixed(2)}` : '--';

    return `<div class="bg-surface-container-lowest rounded-xl border border-outline-variant/10 mb-3 overflow-hidden">
      <!-- Header row: date + badges -->
      <div class="flex items-center justify-between px-5 pt-4 pb-2">
        <div class="flex items-center gap-2">
          <p class="text-xs text-on-surface-variant">${dateStr} · ${timeStr}</p>
          ${sageBadge}
        </div>
        <div class="flex items-center gap-2">
          ${statusHtml}
        </div>
      </div>

      <!-- Main content -->
      <div class="px-5 pb-4">
        <!-- Sent → Received -->
        <div class="flex items-center gap-3 mb-3">
          <div class="flex-1">
            <p class="text-[10px] font-bold text-on-surface-variant uppercase tracking-wider mb-0.5">Sent</p>
            <p class="text-lg font-black text-on-background">${tx.amount} <span class="text-sm font-bold text-on-surface-variant">${tx.fromToken}</span></p>
            <p class="text-xs text-on-surface-variant">${tx.fromChain}</p>
          </div>
          <span class="material-symbols-outlined text-on-surface-variant/40 text-xl flex-shrink-0">arrow_forward</span>
          <div class="flex-1">
            <p class="text-[10px] font-bold text-on-surface-variant uppercase tracking-wider mb-0.5">Received</p>
            <p class="text-lg font-black text-on-background">${tx.outputAmount || '--'} <span class="text-sm font-bold text-on-surface-variant">${tx.toToken}</span></p>
            <p class="text-xs text-on-surface-variant">${tx.toChain}</p>
          </div>
        </div>

        <!-- Details grid -->
        <div class="grid grid-cols-3 gap-3 pt-3 border-t border-outline-variant/10">
          <!-- Recipient -->
          <div>
            <p class="text-[10px] font-bold text-on-surface-variant uppercase tracking-wider mb-0.5">Recipient</p>
            <p class="text-xs font-mono text-on-surface truncate" title="${tx.recipient || ''}">${recipientLabel}</p>
          </div>
          <!-- Transactions -->
          <div>
            <p class="text-[10px] font-bold text-on-surface-variant uppercase tracking-wider mb-0.5">Transactions</p>
            <div class="flex flex-col gap-0.5">
              ${depositUrl
                ? `<a href="${depositUrl}" target="_blank" rel="noopener" class="text-xs text-primary font-bold hover:underline inline-flex items-center gap-0.5">Deposit <span class="material-symbols-outlined text-[10px]">open_in_new</span></a>`
                : '<span class="text-xs text-on-surface-variant">--</span>'}
              ${fillUrl
                ? `<a href="${fillUrl}" target="_blank" rel="noopener" class="text-xs text-primary font-bold hover:underline inline-flex items-center gap-0.5">Fill <span class="material-symbols-outlined text-[10px]">open_in_new</span></a>`
                : ''}
            </div>
          </div>
          <!-- Net Fee -->
          <div>
            <p class="text-[10px] font-bold text-on-surface-variant uppercase tracking-wider mb-0.5">Net Fee</p>
            <p class="text-xs font-bold text-on-surface">${feeHtml}</p>
          </div>
        </div>
      </div>
    </div>`;
  });

  const visible = cards.slice(0, visibleCount);
  const remaining = cards.length - visibleCount;

  list.innerHTML = visible.join('')
    + (remaining > 0
      ? `<button onclick="showMore()" class="w-full py-3 mt-2 bg-surface-container-low text-on-surface-variant rounded-xl font-bold text-sm hover:bg-surface-container-high transition-colors">Show ${Math.min(remaining, PAGE_SIZE)} more of ${remaining} remaining</button>`
      : '');
}

initWallet();
</script>

</body>
</html>
