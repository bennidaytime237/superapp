<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Transactions - Sage</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script>
tailwind.config = {
  darkMode: "class",
  theme: {
    extend: {
      colors: {
        "surface-bright":"#faf7f5","surface":"#faf7f5","background":"#faf7f5",
        "surface-container-lowest":"#ffffff","surface-container-low":"#f2f5ef",
        "surface-container":"#eaefe5","surface-container-high":"#dde6d5",
        "surface-container-highest":"#d3deca","surface-dim":"#dde6d5",
        "surface-variant":"#dde6d5","surface-tint":"#667b68",
        "primary":"#667b68","primary-dim":"#2f3a33","primary-fixed":"#dde6d5",
        "primary-fixed-dim":"#a3b899","primary-container":"#dde6d5",
        "on-primary":"#faf7f5","on-primary-container":"#2f3a33",
        "on-surface":"#2f3a33","on-surface-variant":"#667b68",
        "on-background":"#1f2622",
        "outline":"#667b68","outline-variant":"#a3b899",
        "error":"#9e422c","error-container":"#f8d3c5",
        "on-error":"#faf7f5",
      },
      fontFamily: { "headline":["Outfit"], "body":["Outfit"], "label":["Outfit"] },
      borderRadius: { "DEFAULT":"1rem","lg":"2rem","xl":"3rem","full":"9999px" },
    },
  },
}
</script>
<style>
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
  body { font-family: 'Outfit', sans-serif; }
</style>
</head>
<body class="bg-surface text-on-surface min-h-screen">

<!-- Sidebar -->
<aside class="hidden md:flex flex-col fixed left-0 top-0 h-full w-64 p-4 bg-surface-container-low z-40">
  <a href="index.html" class="mb-10 px-4 py-2 flex items-center gap-2">
    <img src="sage-wordmark.svg" alt="Sage" class="h-7"/>
  </a>
  <nav class="flex-1 space-y-1">
    <a class="flex items-center gap-3 px-4 py-3 text-on-surface-variant hover:text-primary hover:bg-white/50 rounded-full transition-all" href="index.html">
      <span class="material-symbols-outlined">grid_view</span>
      <span class="font-medium text-sm">Dashboard</span>
    </a>
    <a class="flex items-center gap-3 px-4 py-3 text-on-surface-variant hover:text-primary hover:bg-white/50 rounded-full transition-all" href="swap.html">
      <span class="material-symbols-outlined">swap_horiz</span>
      <span class="font-medium text-sm">Swap & Bridge</span>
    </a>
    <a class="flex items-center gap-3 px-4 py-3 bg-surface-container-lowest text-primary rounded-full shadow-sm" href="transactions.html">
      <span class="material-symbols-outlined">receipt_long</span>
      <span class="font-medium text-sm">Transactions</span>
    </a>
    <a class="flex items-center gap-3 px-4 py-3 text-on-surface-variant hover:text-primary hover:bg-white/50 rounded-full transition-all" href="buysell.html">
      <span class="material-symbols-outlined">paid</span>
      <span class="font-medium text-sm">Buy & Sell</span>
    </a>
  </nav>
</aside>

<!-- Main -->
<main class="md:ml-64 min-h-screen pb-24 md:pb-8">
  <header class="flex justify-between items-center w-full px-6 py-4 bg-surface sticky top-0 z-30">
    <div class="flex items-center gap-2">
      <a href="index.html"><img src="sage-wordmark.svg" alt="Sage" class="h-6 md:hidden"/></a>
      <h2 class="hidden md:block font-headline font-bold text-xl tracking-tight text-on-background">Transactions</h2>
    </div>
    <a href="index.html" class="md:hidden text-sm font-medium text-on-surface-variant hover:text-primary flex items-center gap-1">
      <span class="material-symbols-outlined text-sm">arrow_back</span> Back
    </a>
  </header>

  <div class="px-6 lg:px-10 py-6 max-w-3xl">
    <!-- Filter pills -->
    <div class="flex gap-2 mb-6">
      <button onclick="setFilter('all')" id="f-all" class="px-4 py-2 rounded-full text-sm font-bold bg-primary text-on-primary">All</button>
      <button onclick="setFilter('bridge')" id="f-bridge" class="px-4 py-2 rounded-full text-sm font-bold bg-surface-container-low text-on-surface-variant hover:bg-surface-container-high">Bridges</button>
      <button onclick="setFilter('swap')" id="f-swap" class="px-4 py-2 rounded-full text-sm font-bold bg-surface-container-low text-on-surface-variant hover:bg-surface-container-high">Swaps</button>
    </div>

    <!-- Transaction list -->
    <div id="tx-list"></div>
  </div>
</main>

<!-- Mobile nav -->
<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center px-4 pb-6 md:hidden bg-surface/70 backdrop-blur-xl shadow-[0_-4px_40px_rgba(42,52,52,0.04)] rounded-t-3xl">
  <a class="flex flex-col items-center justify-center text-on-surface-variant p-3 active:scale-90" href="index.html">
    <span class="material-symbols-outlined">home</span>
    <span class="font-headline text-[10px] font-bold uppercase mt-1">Home</span>
  </a>
  <a class="flex flex-col items-center justify-center text-on-surface-variant p-3 active:scale-90" href="swap.html">
    <span class="material-symbols-outlined">swap_horiz</span>
    <span class="font-headline text-[10px] font-bold uppercase mt-1">Swap</span>
  </a>
  <a class="flex flex-col items-center justify-center bg-primary-container text-primary rounded-full p-3 active:scale-90" href="transactions.html">
    <span class="material-symbols-outlined">receipt_long</span>
    <span class="font-headline text-[10px] font-bold uppercase mt-1">History</span>
  </a>
</nav>

<script>
let filter = 'all';

function setFilter(f) {
  filter = f;
  ['all','bridge','swap'].forEach(k => {
    const el = document.getElementById('f-' + k);
    el.className = k === f
      ? 'px-4 py-2 rounded-full text-sm font-bold bg-primary text-on-primary'
      : 'px-4 py-2 rounded-full text-sm font-bold bg-surface-container-low text-on-surface-variant hover:bg-surface-container-high';
  });
  render();
}

function render() {
  const list = document.getElementById('tx-list');
  let history = [];
  try { history = JSON.parse(localStorage.getItem('sage_tx_history') || '[]'); } catch {}

  if (filter !== 'all') history = history.filter(tx => tx.type === filter);

  if (history.length === 0) {
    list.innerHTML = `<div class="text-center py-16">
      <span class="material-symbols-outlined text-5xl text-on-surface-variant/20 mb-3">receipt_long</span>
      <p class="text-on-surface-variant">No ${filter === 'all' ? '' : filter + ' '}transactions yet</p>
      <a href="swap.html" class="inline-block mt-4 px-6 py-3 bg-primary text-on-primary rounded-full font-bold text-sm">Make your first ${filter === 'all' ? 'transaction' : filter}</a>
    </div>`;
    return;
  }

  const EXP = {
    1:'https://etherscan.io/tx/',42161:'https://arbiscan.io/tx/',8453:'https://basescan.org/tx/',
    10:'https://optimistic.etherscan.io/tx/',137:'https://polygonscan.com/tx/',324:'https://explorer.zksync.io/tx/',
    59144:'https://lineascan.build/tx/',34443:'https://explorer.mode.network/tx/',81457:'https://blastscan.io/tx/',
    534352:'https://scrollscan.com/tx/',7777777:'https://explorer.zora.energy/tx/',
  };

  list.innerHTML = history.map(tx => {
    const icon = tx.type === 'bridge' ? 'layers' : 'swap_horiz';
    const label = tx.type === 'bridge' ? 'Bridge' : 'Swap';
    const date = new Date(tx.timestamp);
    const dateStr = date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    const timeStr = date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
    const explorerUrl = tx.txHash && tx.fromChainId ? (EXP[tx.fromChainId] || 'https://etherscan.io/tx/') + tx.txHash : null;
    const tag = explorerUrl ? 'a' : 'div';
    const linkAttrs = explorerUrl ? `href="${explorerUrl}" target="_blank" rel="noopener"` : '';

    return `<${tag} ${linkAttrs} class="flex items-center gap-4 px-2 py-4 border-b border-outline-variant/10 ${explorerUrl ? 'hover:bg-surface-container-low cursor-pointer transition-colors' : ''}">
      <div class="w-11 h-11 rounded-full bg-primary-container flex items-center justify-center flex-shrink-0">
        <span class="material-symbols-outlined text-primary text-lg">${icon}</span>
      </div>
      <div class="flex-1 min-w-0">
        <div class="flex justify-between gap-2">
          <p class="text-sm font-bold text-on-background truncate">${label}: ${tx.amount} ${tx.fromToken} → ${tx.toToken}</p>
          <p class="text-sm font-bold text-on-background flex-shrink-0">${tx.amount} ${tx.fromToken}</p>
        </div>
        <div class="flex justify-between gap-2">
          <p class="text-xs text-on-surface-variant">${tx.fromChain} → ${tx.toChain}</p>
          <p class="text-xs text-on-surface-variant">${dateStr} ${timeStr}</p>
        </div>
      </div>
      <div class="flex-shrink-0 flex items-center gap-2">
        <p class="text-xs font-bold text-primary">${tx.time.toFixed(1)}s</p>
        ${explorerUrl ? '<span class="material-symbols-outlined text-on-surface-variant text-base">open_in_new</span>' : ''}
      </div>
    </${tag}>`;
  }).join('');
}

render();
</script>

</body>
</html>
