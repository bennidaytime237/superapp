<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script>
(function(){var t=localStorage.getItem('sage-theme')||(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.className=t;})();
</script>
<title>Transactions - Sage</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg"/>
<link rel="stylesheet" href="tailwind.output.css"/>
<link rel="stylesheet" href="page-styles.css"/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="theme.css"/>
<script src="theme.js"></script>
<script src="safe-dom.js"></script>
<script src="wallet.js"></script>

</head>
<body class="bg-surface text-on-surface min-h-screen">

<!-- Sidebar -->
<aside class="hidden md:flex flex-col fixed left-0 top-0 h-full w-64 p-4 bg-surface-container-low z-40">
  <a href="index.html" class="mb-10 px-4 py-2 flex items-center gap-2">
    <img src="sage-wordmark.svg" alt="Sage" class="h-7"/>
  </a>
  <nav class="flex-1 space-y-1">
    <a class="flex items-center gap-3 px-4 py-3 text-on-surface-variant hover:text-primary hover:bg-white/50 rounded-full transition-all" href="index.html">
      <span class="material-symbols-outlined">grid_view</span>
      <span class="font-medium text-sm">Dashboard</span>
    </a>
    <a class="flex items-center gap-3 px-4 py-3 text-on-surface-variant hover:text-primary hover:bg-white/50 rounded-full transition-all" href="swap.html">
      <span class="material-symbols-outlined">swap_horiz</span>
      <span class="font-medium text-sm">Bridge</span>
    </a>
    <a class="flex items-center gap-3 px-4 py-3 bg-surface-container-lowest text-primary rounded-full shadow-sm" href="transactions.html">
      <span class="material-symbols-outlined">receipt_long</span>
      <span class="font-medium text-sm">Transactions</span>
    </a>
    <a class="flex items-center gap-3 px-4 py-3 text-on-surface-variant hover:text-primary hover:bg-white/50 rounded-full transition-all" href="gas.html">
      <span class="material-symbols-outlined">local_gas_station</span>
      <span class="font-medium text-sm">Gas</span>
    </a>
  </nav>
</aside>

<!-- Main -->
<main class="md:ml-64 min-h-screen pb-24 md:pb-8">
  <header class="flex justify-between items-center w-full px-6 py-4 bg-surface sticky top-0 z-30">
    <div class="flex items-center gap-2">
      <a href="index.html"><img src="sage-wordmark.svg" alt="Sage" class="h-6 md:hidden"/></a>
      <h2 class="hidden md:block font-headline font-bold text-xl tracking-tight text-on-background">Transactions</h2>
    </div>
    <div class="flex items-center gap-3">
      <a href="index.html" class="md:hidden text-sm font-medium text-on-surface-variant hover:text-primary flex items-center gap-1">
        <span class="material-symbols-outlined text-sm">arrow_back</span> Back
      </a>
    <button data-action="toggle-theme" title="Toggle dark mode" aria-label="Toggle dark mode" class="flex items-center gap-2 px-3 py-1.5 bg-surface-container rounded-full text-on-surface-variant hover:text-primary hover:bg-surface-container-high transition-all flex-shrink-0">
      <span class="material-symbols-outlined text-base theme-toggle-icon">dark_mode</span>
    </button>
      <button id="connect-btn" data-action="connect-wallet" class="flex items-center gap-2 px-3 py-1.5 bg-primary text-on-primary rounded-full text-xs font-bold active:scale-95 transition-transform">
        <span class="material-symbols-outlined text-sm">account_balance_wallet</span>
        <span id="connect-label">Connect</span>
      </button>
    </div>
  </header>

  <div class="px-6 lg:px-10 py-6">
    <!-- Search + Filters -->
    <div class="flex flex-wrap gap-2 mb-6 items-center">
      <input id="search-input" type="text" placeholder="Search token, chain, address..." class="flex-1 min-w-[180px] px-4 py-2 rounded-full text-sm border border-outline-variant/15 bg-surface-container-lowest focus:outline-none focus:ring-2 focus:ring-primary/30 placeholder:text-on-surface-variant/40"/>
      <div class="relative" id="dd-chain">
        <button data-action="toggle-drop" data-arg="chain" class="flex items-center gap-1.5 px-4 py-2 rounded-full text-sm font-bold bg-surface-container-low text-on-surface-variant hover:bg-surface-container-high transition-colors">
          <span id="dd-chain-label">All chains</span>
          <span class="material-symbols-outlined text-sm">expand_more</span>
        </button>
        <div id="dd-chain-menu" class="hidden absolute left-0 top-full mt-1 bg-surface-container-lowest rounded-lg shadow-lg border border-outline-variant/10 z-50 min-w-[160px] max-h-[240px] overflow-y-auto py-1"></div>
      </div>
      <div class="relative" id="dd-token">
        <button data-action="toggle-drop" data-arg="token" class="flex items-center gap-1.5 px-4 py-2 rounded-full text-sm font-bold bg-surface-container-low text-on-surface-variant hover:bg-surface-container-high transition-colors">
          <span id="dd-token-label">All tokens</span>
          <span class="material-symbols-outlined text-sm">expand_more</span>
        </button>
        <div id="dd-token-menu" class="hidden absolute left-0 top-full mt-1 bg-surface-container-lowest rounded-lg shadow-lg border border-outline-variant/10 z-50 min-w-[160px] max-h-[240px] overflow-y-auto py-1"></div>
      </div>
      <div class="relative" id="dd-status">
        <button data-action="toggle-drop" data-arg="status" class="flex items-center gap-1.5 px-4 py-2 rounded-full text-sm font-bold bg-surface-container-low text-on-surface-variant hover:bg-surface-container-high transition-colors">
          <span id="dd-status-label">All status</span>
          <span class="material-symbols-outlined text-sm">expand_more</span>
        </button>
        <div id="dd-status-menu" class="hidden absolute left-0 top-full mt-1 bg-surface-container-lowest rounded-lg shadow-lg border border-outline-variant/10 z-50 min-w-[140px] py-1"></div>
      </div>
    </div>

    <!-- Transaction list -->
    <div id="tx-list"></div>
  </div>
</main>

<!-- Mobile Bottom Nav -->
<nav class="fixed bottom-5 left-4 right-4 z-50 md:hidden flex items-center justify-around py-3 px-2 bg-surface-container/95 backdrop-blur-xl rounded-full shadow-[0_8px_40px_rgba(0,0,0,0.12)] border border-outline-variant/15">
  <a class="flex flex-col items-center justify-center text-on-surface-variant p-3 transition-transform active:scale-90" href="index.html">
    <span class="material-symbols-outlined">home</span>
    <span class="font-headline text-[10px] font-bold uppercase mt-1">Home</span>
  </a>
  <a class="flex flex-col items-center justify-center text-on-surface-variant p-3 transition-transform active:scale-90" href="swap.html">
    <span class="material-symbols-outlined">swap_horiz</span>
    <span class="font-headline text-[10px] font-bold uppercase mt-1">Bridge</span>
  </a>
  <a class="flex flex-col items-center justify-center text-on-surface-variant p-3 transition-transform active:scale-90" href="payments.html">
    <span class="material-symbols-outlined">send</span>
    <span class="font-headline text-[10px] font-bold uppercase mt-1">Pay</span>
  </a>
  <button data-action="toggle-mobile-menu" class="flex flex-col items-center justify-center bg-primary-container text-primary rounded-full p-3 transition-transform active:scale-90">
    <span class="material-symbols-outlined">menu</span>
    <span class="font-headline text-[10px] font-bold uppercase mt-1">More</span>
  </button>
</nav>

<!-- Mobile More Menu -->
<div id="mobile-menu" class="hidden fixed inset-0 z-40 md:hidden" data-action="close-mobile-menu">
  <div class="absolute bottom-24 left-4 right-4 bg-surface-container rounded-2xl shadow-xl border border-outline-variant/10 overflow-hidden">
    <div class="p-2">
      <a href="transactions.html" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-surface-container-high">
        <span class="material-symbols-outlined text-primary">receipt_long</span>
        <span class="font-medium text-sm text-on-surface">Transactions</span>
      </a>
      <a href="radar.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-surface-container-high transition-colors">
        <span class="material-symbols-outlined text-on-surface-variant">radar</span>
        <span class="font-medium text-sm text-on-surface">Radar</span>
      </a>
      <a href="gas.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-surface-container-high transition-colors">
        <span class="material-symbols-outlined text-on-surface-variant">local_gas_station</span>
        <span class="font-medium text-sm text-on-surface">Gas</span>
      </a>
      <a href="sweep.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-surface-container-high transition-colors">
        <span class="material-symbols-outlined text-on-surface-variant">move_to_inbox</span>
        <span class="font-medium text-sm text-on-surface">Sweep</span>
      </a>
      <a href="hyperliquid.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-surface-container-high transition-colors">
        <span class="material-symbols-outlined text-on-surface-variant">account_balance</span>
        <span class="font-medium text-sm text-on-surface">Hyperliquid</span>
      </a>
      <a href="polymarket.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-surface-container-high transition-colors">
        <span class="material-symbols-outlined text-on-surface-variant">trending_up</span>
        <span class="font-medium text-sm text-on-surface">Polymarket</span>
      </a>
    </div>
  </div>
</div>


<script defer src="transactions.js"></script>
<script src="disclaimer.js"></script>
</body>
</html>
