<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
  <defs>
    <!-- Masks out the front coin area so back coin shows only as a crescent -->
    <mask id="back-coin-mask">
      <rect width="24" height="24" fill="white"/>
      <circle cx="9" cy="14" r="7" fill="black"/>
    </mask>
  </defs>
  <!-- Back coin (crescent, top-right) -->
  <circle cx="14.5" cy="7" r="5" mask="url(#back-coin-mask)"/>
  <!-- Front coin (larger, center-left) -->
  <circle cx="9" cy="14" r="6.5"/>
  <!-- Deposit tray -->
  <rect x="1" y="21.5" width="22" height="2.5" rx="1.25"/>
</svg>
