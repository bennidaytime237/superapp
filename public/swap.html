<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Swap & Bridge - Sage</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script>
tailwind.config = {
  darkMode: "class",
  theme: {
    extend: {
      colors: {
        "outline-variant":"#a3b899","on-surface":"#2f3a33","background":"#faf7f5",
        "on-primary-container":"#2f3a33","on-primary":"#faf7f5","primary":"#667b68",
        "surface-container-lowest":"#ffffff","surface-container-high":"#dde6d5",
        "surface-bright":"#faf7f5","on-background":"#1f2622","on-error":"#faf7f5",
        "outline":"#667b68","error":"#9e422c","surface":"#faf7f5",
        "surface-dim":"#dde6d5","on-surface-variant":"#667b68",
        "surface-container":"#eaefe5","surface-container-low":"#f2f5ef",
        "primary-fixed":"#dde6d5","primary-container":"#dde6d5",
        "error-container":"#f8d3c5","surface-variant":"#dde6d5",
        "surface-container-highest":"#d3deca",
        "sage-peach":"#f8d3c5","sage-peach-light":"#fceee9",
      },
      fontFamily: { "headline":["Outfit"], "body":["Outfit"], "label":["Outfit"] },
      borderRadius: { "DEFAULT":"1rem","lg":"2rem","xl":"3rem","full":"9999px" },
    },
  },
}
</script>
<style>
  body { font-family: 'Outfit', sans-serif; }
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
  input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; }
  html { height: 100%; }
</style>
</head>
<body class="bg-background text-on-surface antialiased h-screen flex flex-col overflow-hidden">

<!-- Header -->
<header class="w-full max-w-2xl mx-auto h-14 flex justify-between items-center px-6 flex-shrink-0">
  <a href="index.html" class="flex items-center gap-2">
    <img src="sage-wordmark.svg" alt="Sage" class="h-6"/>
  </a>
  <div class="flex items-center gap-3">
    <a href="index.html" class="text-xs font-medium text-on-surface-variant hover:text-primary transition-colors flex items-center gap-1">
      <span class="material-symbols-outlined text-sm">arrow_back</span>
      Dashboard
    </a>
    <button id="connect-btn" onclick="connectWallet()" class="flex items-center gap-2 px-3 py-1.5 bg-primary text-on-primary rounded-full text-xs font-bold active:scale-95 transition-transform">
      <span class="material-symbols-outlined text-sm">account_balance_wallet</span>
      <span id="connect-label">Connect</span>
    </button>
  </div>
</header>

<!-- Main -->
<main class="w-full max-w-[640px] mx-auto px-8 py-6 flex-1 flex flex-col justify-center min-h-0">

  <!-- Rate pill — right aligned -->
  <div class="flex justify-end mb-5">
    <button class="bg-surface-container-low px-5 py-2.5 rounded-full text-sm font-bold text-on-surface flex items-center gap-2 border border-outline-variant/10 shadow-sm hover:bg-surface-container-high transition-colors">
      <span id="rate-display">--</span>
      <span class="material-symbols-outlined text-base">chevron_right</span>
    </button>
  </div>

  <!-- ═══ FROM ═══ -->
  <div class="mb-3">
    <p class="text-base text-on-surface-variant mb-3">From <span class="font-bold text-on-surface">Wallet</span></p>
    <div class="flex items-end justify-between gap-6">
      <button onclick="cycleToken('from')" class="inline-flex items-center gap-2 bg-surface-container-low pl-1.5 pr-4 py-1.5 rounded-full border border-outline-variant/10 hover:bg-surface-container-high transition-colors">
        <div class="relative">
          <img id="from-token-icon" src="" alt="" class="w-8 h-8 rounded-full"/>
          <img id="from-chain-icon" src="" alt="" class="w-5 h-5 rounded-full absolute -right-1 -bottom-0.5 border-2 border-white bg-white"/>
        </div>
        <span id="from-token-label" class="font-bold text-base ml-1">ETH</span>
        <span class="material-symbols-outlined text-base text-on-surface-variant">expand_more</span>
      </button>
      <input id="input-amount" class="flex-1 text-right text-5xl md:text-6xl font-black text-on-background border-none focus:ring-0 p-0 bg-transparent placeholder:text-on-surface-variant/15 min-w-0 leading-none" placeholder="0" type="number" oninput="onAmountChange()"/>
    </div>
    <!-- Balance / warning -->
    <div id="balance-warning" class="flex justify-end mt-3">
      <div id="balance-normal" class="inline-flex items-center gap-2 text-sm text-on-surface-variant">
        <span>Balance: <button onclick="setMax()" class="font-bold hover:underline underline-offset-2" id="from-balance">--</button></span>
      </div>
      <div id="balance-warn" class="hidden inline-flex items-center gap-2 text-sm text-on-surface-variant bg-sage-peach-light px-3 py-1.5 rounded-lg">
        <span class="text-amber-600 text-base">&#9888;</span>
        <span>You only have <button onclick="setMax()" class="font-bold underline underline-offset-2 decoration-dotted" id="from-balance-warn">--</button> available</span>
      </div>
    </div>
  </div>

  <!-- ═══ DIVIDER + SWAP ═══ -->
  <div class="relative h-px bg-outline-variant/15 w-full my-5">
    <button onclick="swapTokens()" class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-11 h-11 bg-white border border-outline-variant/10 shadow-md rounded-full flex items-center justify-center text-on-surface-variant hover:text-primary hover:rotate-180 transition-all duration-300">
      <span class="material-symbols-outlined text-xl">swap_vert</span>
    </button>
  </div>

  <!-- ═══ TO ═══ -->
  <div class="mb-3">
    <p class="text-base text-on-surface-variant mb-3">To <span class="font-bold text-on-surface">Wallet</span></p>
    <div class="flex items-end justify-between gap-6">
      <button onclick="cycleToken('to')" class="inline-flex items-center gap-2 bg-surface-container-low pl-1.5 pr-4 py-1.5 rounded-full border border-outline-variant/10 hover:bg-surface-container-high transition-colors">
        <div class="relative">
          <img id="to-token-icon" src="" alt="" class="w-8 h-8 rounded-full"/>
          <img id="to-chain-icon" src="" alt="" class="w-5 h-5 rounded-full absolute -right-1 -bottom-0.5 border-2 border-white bg-white"/>
        </div>
        <span id="to-token-label" class="font-bold text-base ml-1">USDC</span>
        <span class="material-symbols-outlined text-base text-on-surface-variant">expand_more</span>
      </button>
      <span id="output-amount" class="flex-1 text-right text-5xl md:text-6xl font-black text-on-background leading-none min-w-0 select-text">--</span>
    </div>
    <div class="flex justify-end mt-1">
      <span id="output-usd" class="text-sm text-on-surface-variant"></span>
    </div>
  </div>

  <!-- ═══ FEE BREAKDOWN ═══ -->
  <div class="mt-4 mb-4">
    <button onclick="toggleFeeBreakdown()" class="w-full flex items-center justify-between py-3 text-left">
      <div class="flex items-center gap-2">
        <span id="fee-display" class="text-sm font-bold text-on-surface">--</span>
        <span id="fee-label" class="text-sm text-on-surface-variant">total fee</span>
      </div>
      <div class="flex items-center gap-1">
        <span id="fee-route" class="text-xs text-on-surface-variant"></span>
        <span id="fee-chevron" class="material-symbols-outlined text-on-surface-variant text-base transition-transform">expand_more</span>
      </div>
    </button>
    <div id="fee-breakdown" class="hidden space-y-2 pb-3 text-sm">
      <div class="flex justify-between"><span class="text-on-surface-variant">Route</span><span id="bd-route" class="text-on-surface font-medium">--</span></div>
      <div class="flex justify-between"><span class="text-on-surface-variant">Provider</span><span id="bd-provider" class="text-on-surface font-medium">--</span></div>
      <div class="flex justify-between"><span class="text-on-surface-variant">Fee</span><span id="bd-fee" class="text-on-surface font-medium">--</span></div>
      <div class="flex justify-between"><span class="text-on-surface-variant">Estimated time</span><span id="bd-time" class="text-on-surface font-medium">--</span></div>
      <div class="flex justify-between"><span class="text-on-surface-variant">Slippage</span><span id="bd-slip" class="text-on-surface font-medium">Auto</span></div>
    </div>
  </div>

  <!-- ═══ REVIEW BUTTON ═══ -->
  <button id="action-btn" onclick="executeSwap()" class="w-full py-4 bg-surface-container-high text-on-surface-variant rounded-full font-black text-lg transition-colors">
    Review
  </button>

</main>

<!-- Transaction Screen -->
<div id="tx-screen" class="fixed inset-0 z-40 bg-background hidden flex-col px-8">

  <!-- Top bar -->
  <div class="w-full max-w-2xl mx-auto h-14 flex justify-between items-center flex-shrink-0">
    <a href="index.html" class="p-2 text-on-surface-variant hover:text-primary transition-colors">
      <span class="material-symbols-outlined">home</span>
    </a>
    <button onclick="closeTxScreen()" class="p-2 text-on-surface-variant hover:text-primary transition-colors">
      <span class="material-symbols-outlined">close</span>
    </button>
  </div>

  <!-- Center content -->
  <div class="flex-1 flex items-center justify-center">

    <!-- Loading state -->
    <div id="tx-loading" class="flex flex-col items-center gap-6">
      <div class="relative w-20 h-20">
        <div class="absolute inset-0 rounded-full border-4 border-surface-container-high"></div>
        <div class="absolute inset-0 rounded-full border-4 border-primary border-t-transparent animate-spin"></div>
        <img src="sage-logo.svg" alt="" class="absolute inset-0 m-auto w-8 h-8"/>
      </div>
      <div class="text-center">
        <p id="tx-status" class="text-lg font-bold text-on-background mb-1">Bridging...</p>
        <p id="tx-detail" class="text-sm text-on-surface-variant">Waiting for confirmation</p>
        <p id="tx-timer" class="text-2xl font-black text-primary mt-4 tabular-nums">0.0s</p>
      </div>
    </div>

    <!-- Success state -->
    <div id="tx-success" class="hidden flex flex-col items-center gap-6 max-w-sm text-center">
      <div class="w-20 h-20 rounded-full bg-primary flex items-center justify-center">
        <span class="material-symbols-outlined text-on-primary text-4xl">check</span>
      </div>
      <div>
        <p class="text-2xl font-black text-on-background mb-1">Complete</p>
        <p id="tx-summary" class="text-sm text-on-surface-variant mb-2"></p>
        <p id="tx-time-final" class="text-4xl font-black text-primary tabular-nums"></p>
      </div>
      <div class="flex flex-col gap-3 w-full mt-6">
        <button onclick="closeTxScreen()" class="w-full py-4 bg-primary text-on-primary rounded-full font-bold text-base">
          New transaction
        </button>
        <a id="tx-share-btn" href="" target="_blank" class="hidden w-full py-4 bg-surface-container-low text-on-surface rounded-full font-bold text-base text-center hover:bg-surface-container-high transition-colors">
          Share on X
        </a>
        <a href="index.html" class="w-full py-4 text-on-surface-variant rounded-full font-bold text-base text-center hover:text-primary transition-colors">
          Return to Dashboard
        </a>
      </div>
      <!-- Auto-redirect countdown -->
      <div class="w-full mt-2">
        <div class="h-1 bg-surface-container-high rounded-full overflow-hidden">
          <div id="tx-countdown-bar" class="h-full bg-primary rounded-full transition-all" style="width:100%"></div>
        </div>
        <p id="tx-countdown-text" class="text-xs text-on-surface-variant mt-2">Returning to dashboard in 20s</p>
      </div>
    </div>

  </div>
</div>

<!-- Token Picker Modal -->
<div id="token-modal" class="fixed inset-0 z-50 hidden">
  <!-- Backdrop -->
  <div class="absolute inset-0 bg-black/30 backdrop-blur-sm" onclick="closeTokenModal()"></div>
  <!-- Panel -->
  <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full max-w-md bg-white rounded-3xl shadow-2xl p-8 max-h-[80vh] flex flex-col">
    <!-- Header -->
    <div class="flex items-center justify-between mb-6">
      <h3 class="text-xl font-black text-on-background">Choose a token</h3>
      <button onclick="closeTokenModal()" class="w-10 h-10 rounded-full bg-surface-container-low flex items-center justify-center hover:bg-surface-container-high transition-colors">
        <span class="material-symbols-outlined text-on-surface-variant">close</span>
      </button>
    </div>
    <!-- Chain filter grid -->
    <div id="chain-grid" class="grid grid-cols-6 gap-2 mb-4">
      <!-- Populated by JS -->
    </div>
    <!-- Search -->
    <input id="token-search" type="text" placeholder="Search token or chain..." class="w-full px-4 py-3 rounded-xl border border-outline-variant/15 text-sm mb-3 focus:outline-none focus:ring-2 focus:ring-primary/30" oninput="filterTokenList()"/>
    <!-- Token list -->
    <div id="token-list" class="overflow-y-auto max-h-[45vh] space-y-1">
      <!-- Populated by JS -->
    </div>
  </div>
</div>

<script>
// ── Config ──
const TW = 'https://raw.githubusercontent.com/trustwallet/assets/master/blockchains';
const ACROSS_API = 'https://app.across.to/api';

let CHAINS = [
  { id: 1, name: 'Ethereum', slug: 'ethereum' },
  { id: 42161, name: 'Arbitrum', slug: 'arbitrum' },
  { id: 8453, name: 'Base', slug: 'base' },
  { id: 10, name: 'Optimism', slug: 'optimism' },
  { id: 137, name: 'Polygon', slug: 'polygon' },
  { id: 324, name: 'zkSync Era', slug: 'zksync' },
  { id: 59144, name: 'Linea', slug: 'linea' },
  { id: 34443, name: 'Mode', slug: 'mode' },
  { id: 1135, name: 'Lisk', slug: 'lisk' },
  { id: 480, name: 'World Chain', slug: 'worldchain' },
  { id: 81457, name: 'Blast', slug: 'blast' },
  { id: 534352, name: 'Scroll', slug: 'scroll' },
  { id: 7777777, name: 'Zora', slug: 'zora' },
];

let TOKENS = [
  { symbol: 'ETH', name: 'Ethereum', decimals: 18, native: true,
    addresses: { 1:null, 42161:null, 8453:null, 10:null, 324:null, 59144:null, 34443:null, 81457:null, 534352:null, 7777777:null, 480:null },
    wrapAddresses: { 1:'0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2', 42161:'0x82aF49447D8a07e3bd95BD0d56f35241523fBab1', 8453:'0x4200000000000000000000000000000000000006', 10:'0x4200000000000000000000000000000000000006', 324:'0x5AEa5775959fBC2557Cc8789bC1bf90A239D9a91', 59144:'0xe5D7C2a44FfDDf6b295A15c148167daaAf5Cf34f', 34443:'0x4200000000000000000000000000000000000006', 81457:'0x4300000000000000000000000000000000000004', 534352:'0x5300000000000000000000000000000000000004', 7777777:'0x4200000000000000000000000000000000000006', 480:'0x4200000000000000000000000000000000000006' }},
  { symbol: 'USDC', name: 'USD Coin', decimals: 6, native: false,
    addresses: { 1:'0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48', 42161:'0xaf88d065e77c8cC2239327C5EDb3A432268e5831', 8453:'0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913', 10:'0x0b2C639c533813f4Aa9D7837CAf62653d097Ff85', 137:'0x3c499c542cEF5E3811e1192ce70d8cC03d5c3359' }},
  { symbol: 'USDT', name: 'Tether', decimals: 6, native: false,
    addresses: { 1:'0xdAC17F958D2ee523a2206206994597C13D831ec7', 42161:'0xFd086bC7CD5C481DCC9C85ebE478A1C0b69FCbb9', 10:'0x94b008aA00579c1307B0EF2c499aD98a8ce58e58' }},
  { symbol: 'WBTC', name: 'Wrapped BTC', decimals: 8, native: false,
    addresses: { 1:'0x2260FAC5E5542a773Aa44fBCfeDf7C193bc2C599', 42161:'0x2f2a2543B76A4166549F7aaB2e75Bef0aefC5B0f' }},
  { symbol: 'DAI', name: 'Dai', decimals: 18, native: false,
    addresses: { 1:'0x6B175474E89094C44Da98b954EedeAC495271d0F', 42161:'0xDA10009cBd5D07dd0CeCc66161FC93D7c9000da1' }},
  { symbol: 'WETH', name: 'Wrapped ETH', decimals: 18, native: false,
    addresses: { 1:'0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2', 42161:'0x82aF49447D8a07e3bd95BD0d56f35241523fBab1', 8453:'0x4200000000000000000000000000000000000006', 10:'0x4200000000000000000000000000000000000006' }},
  { symbol: 'UMA', name: 'UMA', decimals: 18, native: false,
    addresses: { 1:'0x04Fa0d235C4abf4BcF4787aF4CF447DE572eF828', 42161:'0xd693Ec944A85eeca4247eC1c3b130DCa9B0C3b22', 10:'0xE7798f023fC62146e8Aa1b36Da45fb70855a77Ea', 137:'0x3066818837c5e6eD6601bd5a91B0762a89fB4EB5' }},
  { symbol: 'ACX', name: 'Across Protocol', decimals: 18, native: false,
    addresses: { 1:'0x44108f0223A3C3028F5Fe7AEC7f9bb2E66beF82F', 42161:'0x53691596d1BCe8CEa565b3fBC4d3b90d8b025213', 10:'0xFf733b2A3557a7ed6697007ab5D11B79FdD1b76B', 137:'0xF328b73B6c685831F238c30a23Fc19140CB4D8FC' }},
  { symbol: 'POOL', name: 'PoolTogether', decimals: 18, native: false,
    addresses: { 1:'0x0cEC1A9154Ff802e7934Fc916Ed7Ca50bDE6844e', 10:'0x395Ae52bB17aef68C2888d941736A71dC6d4e125' }},
  { symbol: 'SNX', name: 'Synthetix', decimals: 18, native: false,
    addresses: { 1:'0xC011a73ee8576Fb46F5E1c5751cA3B9Fe0af2a6F', 10:'0x8700dAec35aF8Ff88c16BdF0418774CB3D7599B4' }},
];

// ── Uniswap Quoter V2 (same address on all chains) ──
const UNI_QUOTER = '0x61fFE014bA17989E743c5F6cB21bF9697530B21e';
const UNI_ROUTER = '0x3fC91A3afd70395Cd496C647d5a6CC9D4B2b7FAD';
// quoteExactInputSingle selector: 0xc6a5026a
function encodeQuoteExactInputSingle(tokenIn, tokenOut, amountIn, fee) {
  const sel = '0xc6a5026a';
  const p = (v) => v.replace('0x','').padStart(64,'0');
  return sel + p(tokenIn) + p(tokenOut) + p(BigInt(amountIn).toString(16)) + p(BigInt(fee).toString(16)) + p('0');
}

// ── State ──
let fromChainIdx = 0, toChainIdx = 1;
let fromTokenIdx = 0, toTokenIdx = 1;
let slippage = 'auto';
let walletAddress = null;
let fromBal = null; // raw number
let prices = {};
let quoteTimer = null;
let lastQuote = null; // stores Across swap/approval response

// ── Icon helpers ──
function tokenIconUrl(token, chainId) {
  if (token.native) {
    // Use WETH address for the ETH icon, not the chain logo
    const wethAddr = token.wrapAddresses?.[1] || '0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2';
    return `${TW}/ethereum/assets/${wethAddr}/logo.png`;
  }
  const addr = token.addresses[chainId];
  const slug = CHAINS.find(c=>c.id===chainId)?.slug;
  if (addr && slug) return `${TW}/${slug}/assets/${addr}/logo.png`;
  const ethAddr = token.addresses[1];
  if (ethAddr) return `${TW}/ethereum/assets/${ethAddr}/logo.png`;
  return '';
}
function chainLogoUrl(chainId) {
  const c = CHAINS.find(c=>c.id===chainId);
  return c ? `${TW}/${c.slug}/info/logo.png` : '';
}

// ── Wallet ──
async function connectWallet() {
  if (!window.ethereum) { alert('Install MetaMask to continue'); return; }
  try {
    const accs = await window.ethereum.request({ method: 'eth_requestAccounts' });
    walletAddress = accs[0];
    const short = walletAddress.slice(0,6) + '...' + walletAddress.slice(-4);
    document.getElementById('connect-label').textContent = short;
    updateBalance();
    updateActionBtn();
  } catch(e) { console.error(e); }
}

async function updateBalance() {
  if (!walletAddress) return;
  const token = TOKENS[fromTokenIdx];
  const chainId = CHAINS[fromChainIdx].id;
  try {
    const res = await fetch(`/api/balances?address=${walletAddress}`);
    const data = await res.json();
    cachedBalances = data;
    // find balance for this token on this chain
    const chainData = data[chainId] || {};
    const bal = chainData[token.symbol] || 0;
    fromBal = bal;
    document.getElementById('from-balance').textContent = `${fmtNum(bal)} ${token.symbol}`;
    document.getElementById('from-balance-warn').textContent = `${fmtNum(bal)} ${token.symbol}`;
    updateBalanceWarning();
  } catch { fromBal = null; }
}

// ── Prices ──
async function fetchPrices() {
  try {
    const res = await fetch('/api/prices');
    const raw = await res.json();
    prices = {
      ETH: raw.ethereum?.usd || 0,
      WBTC: raw['wrapped-bitcoin']?.usd || raw.bitcoin?.usd || 0,
      USDC: 1, USDT: 1, DAI: 1,
    };
  } catch { prices = { ETH:2800, WBTC:94000, USDC:1, USDT:1, DAI:1 }; }
  updateRate();
}

// ── Mode ──

// ── Token picker modal ──
let pickerSide = 'from';
let cachedBalances = null;
let allModalRows = [];
let modalChainFilter = null; // null = all chains

function cycleToken(side) { openTokenModal(side); }

function openTokenModal(side) {
  pickerSide = side;
  modalChainFilter = null;
  document.getElementById('token-search').value = '';
  buildChainGrid();
  buildTokenList();
  document.getElementById('token-modal').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
  document.getElementById('token-search').focus();
}

function buildChainGrid() {
  const grid = document.getElementById('chain-grid');
  const top10 = CHAINS.slice(0, 10);
  grid.innerHTML = `<button onclick="setChainFilter(null)" class="flex flex-col items-center justify-center w-12 h-12 rounded-xl text-[10px] font-bold transition-colors ${modalChainFilter === null ? 'bg-primary text-on-primary' : 'bg-surface-container-low text-on-surface-variant hover:bg-surface-container-high'}">All</button>` +
    top10.map(c => {
      const active = modalChainFilter === c.id;
      return `<button onclick="setChainFilter(${c.id})" class="flex flex-col items-center justify-center w-12 h-12 rounded-xl transition-colors ${active ? 'bg-primary' : 'bg-surface-container-low hover:bg-surface-container-high'}" title="${c.name}">

function setChainFilter(chainId) {

function buildTokenList() {
  allModalRows = [];
  CHAINS.forEach((chain) => {
    TOKENS.forEach((token, tIdx) => {
      const hasAddr = token.native
        ? (token.addresses.hasOwnProperty(chain.id))
        : (token.addresses[chain.id]);
      if (!hasAddr) return;
      allModalRows.push({ chain, token, tIdx });
    });
  });

  allModalRows.sort((a, b) => {
    const balA = cachedBalances?.[a.chain.id]?.[a.token.symbol] || 0;
    const balB = cachedBalances?.[b.chain.id]?.[b.token.symbol] || 0;
    if (balA > 0 && balB <= 0) return -1;
    if (balB > 0 && balA <= 0) return 1;
    if (a.token.symbol < b.token.symbol) return -1;
    if (a.token.symbol > b.token.symbol) return 1;
    return a.chain.name.localeCompare(b.chain.name);
  });

  filterTokenList();
}

function renderModalRows(rows) {
  const list = document.getElementById('token-list');
  const selToken = pickerSide === 'from' ? TOKENS[fromTokenIdx] : TOKENS[toTokenIdx];
  const selChain = pickerSide === 'from'
    ? CHAINS[fromChainIdx]
    : CHAINS[toChainIdx];

  list.innerHTML = rows.map(({ chain, token, tIdx }) => {
    const bal = cachedBalances?.[chain.id]?.[token.symbol] || 0;
    const price = prices[token.symbol] || 0;
    const usdVal = bal * price;
    const isSelected = selToken.symbol === token.symbol && selChain.id === chain.id;
    const highlight = isSelected ? 'bg-primary-container/20' : 'hover:bg-surface-container-low';
    const tIcon = tokenIconUrl(token, chain.id);
    const cIcon = `${TW}/${chain.slug}/info/logo.png`;

    return `<button onclick="selectToken(${tIdx}, ${chain.id})" class="w-full flex items-center gap-3 px-4 py-3 ${highlight} rounded-xl transition-colors text-left" data-search="${token.symbol} ${token.name} ${chain.name}">
      <div class="relative flex-shrink-0">
        <img src="${tIcon}" alt="${token.symbol}" class="w-10 h-10 rounded-full bg-surface-container" onerror="this.style.display='none'"/>
        <img src="${cIcon}" alt="${chain.name}" class="w-5 h-5 rounded-full absolute -bottom-0.5 -right-0.5 border-2 border-white bg-white"/>
      </div>
      <div class="flex-1 min-w-0">
        <p class="font-bold text-[15px] ${bal > 0 ? 'text-on-background' : 'text-on-surface-variant'}">${bal > 0 ? fmtNum(bal) + ' ' : '0 '}${token.symbol}</p>
        <p class="text-xs text-on-surface-variant">${token.name} · ${chain.name}</p>
      </div>
      ${bal > 0 ? `<span class="text-xs text-on-surface-variant font-medium">$${fmtNum(usdVal)}</span>` : ''}

      token.symbol.toLowerCase().includes(q) ||

// ── Unified quote fetcher: Uniswap, Across, double-bridge ──
async function fetchBestQuote(amount) {
  const fromToken = TOKENS[fromTokenIdx];
  const toToken = TOKENS[toTokenIdx];
  const originChain = CHAINS[fromChainIdx].id;
  const destChain = CHAINS[toChainIdx].id;
  const fp = prices[fromToken.symbol] || 0;
  const tp = prices[toToken.symbol] || 0;
  const amountWei = BigInt(Math.floor(amount * 10 ** fromToken.decimals)).toString();
  const sameChain = originChain === destChain;

  const candidates = []; // { outputNum, provider, route, quote, type }

  // 1) Uniswap (same-chain only)
  if (sameChain && fromToken.symbol !== toToken.symbol) {
    try {
      const uniResult = await fetchUniswapQuote(originChain, fromToken, toToken, amountWei);
      if (uniResult) candidates.push(uniResult);
    } catch (e) { console.warn('Uniswap quote failed:', e); }
  }

  // 2) Across (crosschain only)
  if (!sameChain) {
    try {
      const acrossResult = await fetchAcrossQuote(originChain, destChain, fromToken, toToken, amountWei);
      if (acrossResult) candidates.push(acrossResult);
    } catch (e) { console.warn('Across quote failed:', e); }
  }

  // 3) Double-bridge (same-chain swap via intermediary)
  if (sameChain && fromToken.symbol !== toToken.symbol) {
    const intermediaries = CHAINS.filter(c => c.id !== originChain).slice(0, 3);
    const dbPromises = intermediaries.map(async (mid) => {
      try {
        return await fetchDoubleBridgeQuote(originChain, mid.id, fromToken, toToken, amountWei, mid.name);
      } catch { return null; }
    });
    const dbResults = (await Promise.allSettled(dbPromises))
      .filter(r => r.status === 'fulfilled' && r.value)
      .map(r => r.value);
    candidates.push(...dbResults);
  }

  if (candidates.length === 0) {
    document.getElementById('fee-display').textContent = 'No route found';
    document.getElementById('fee-route').textContent = '';
    return;
  }

  // Pick best output
  candidates.sort((a, b) => b.outputNum - a.outputNum);
  const best = candidates[0];
  lastQuote = best.quote;
  lastQuote._routeType = best.type;
  lastQuote._provider = best.provider;
  lastQuote._route = best.route;

  // Update UI
  document.getElementById('output-amount').textContent = fmtNum(best.outputNum);
  document.getElementById('output-usd').textContent = `≈ $${fmtNum(best.outputNum * tp)}`;
  document.getElementById('fee-display').textContent = best.feeDisplay;
  document.getElementById('fee-route').textContent = `via ${best.provider}`;

  // Breakdown
  document.getElementById('bd-route').textContent = best.route;
  document.getElementById('bd-provider').textContent = best.provider;
  document.getElementById('bd-fee').textContent = best.feeDisplay;
  document.getElementById('bd-time').textContent = best.time;
  document.getElementById('bd-slip').textContent = slippage === 'auto' ? 'Auto' : (parseFloat(slippage) * 100) + '%';
}

// ── Uniswap on-chain quote ──
async function fetchUniswapQuote(chainId, fromToken, toToken, amountWei) {
  const tokenIn = fromToken.native ? fromToken.wrapAddresses?.[chainId] : fromToken.addresses[chainId];
  const tokenOut = toToken.native ? toToken.wrapAddresses?.[chainId] : toToken.addresses[chainId];
  if (!tokenIn || !tokenOut) return null;

  const chainHex = '0x' + chainId.toString(16);
  const fees = [3000, 500, 10000]; // try different pool fees
  let bestOutput = null;
  let bestFee = 0;

  for (const fee of fees) {
    try {
      const calldata = encodeQuoteExactInputSingle(tokenIn, tokenOut, amountWei, fee);
      const result = await window.ethereum.request({
        method: 'eth_call',
        params: [{ to: UNI_QUOTER, data: calldata }, 'latest'],
      });
      if (result && result !== '0x') {
        const outputWei = BigInt(result.slice(0, 66));
        if (!bestOutput || outputWei > bestOutput) {
          bestOutput = outputWei;
          bestFee = fee;
        }
      }
    } catch {}
  }

  if (!bestOutput) return null;
  const outputNum = Number(bestOutput) / 10 ** toToken.decimals;
  const inputNum = Number(BigInt(amountWei)) / 10 ** fromToken.decimals;
  const fp = prices[fromToken.symbol] || 0;
  const feePercent = bestFee / 10000;

  return {
    outputNum,
    provider: 'Uniswap',
    route: `${fromToken.symbol} → ${toToken.symbol} on ${CHAINS[fromChainIdx].name}`,
    feeDisplay: `${feePercent}% pool fee`,
    time: '~15 seconds',
    type: 'uniswap',
    quote: {
      tokenIn, tokenOut, amountWei, fee: bestFee, chainId, outputWei: bestOutput.toString(),
    },
  };
}

// ── Across crosschain quote ──
async function fetchAcrossQuote(originChain, destChain, fromToken, toToken, amountWei) {
  const inputAddr = fromToken.native ? fromToken.wrapAddresses?.[originChain] : fromToken.addresses[originChain];
  const outputAddr = toToken.native ? toToken.wrapAddresses?.[destChain] : toToken.addresses[destChain];
  if (!inputAddr || !outputAddr) return null;

  const params = new URLSearchParams({
    tradeType: 'exactInput', amount: amountWei, inputToken: inputAddr, outputToken: outputAddr,
    originChainId: originChain, destinationChainId: destChain,
    depositor: walletAddress || '0x0000000000000000000000000000000000000000', slippage: slippage,
  });

  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), 8000);
  const res = await fetch(`${ACROSS_API}/swap/approval?${params}`, { signal: ctrl.signal });
  clearTimeout(t);
  if (!res.ok) return null;
  const data = await res.json();

  const outputNum = data.expectedOutput ? Number(BigInt(data.expectedOutput)) / 10 ** toToken.decimals : 0;
  const fp = prices[fromToken.symbol] || 0;
  const totalFee = data.fees?.totalRelayFee?.total ? Number(BigInt(data.fees.totalRelayFee.total)) / 10 ** fromToken.decimals : 0;
  const fromChainName = CHAINS.find(c => c.id === originChain)?.name || originChain;
  const toChainName = CHAINS.find(c => c.id === destChain)?.name || destChain;

  return {
    outputNum,
    provider: 'Across Protocol',
    route: `${fromToken.symbol}(${fromChainName}) → ${toToken.symbol}(${toChainName})`,
    feeDisplay: `~$${fmtNum(totalFee * fp)}`,
    time: '~2 seconds',
    type: 'across',
    quote: data,
  };
}

// ── Double-bridge quote (same-chain swap via intermediary) ──
async function fetchDoubleBridgeQuote(chainId, midChainId, fromToken, toToken, amountWei, midName) {
  // Leg 1: fromToken on chainId → toToken on midChain
  const leg1Input = fromToken.native ? fromToken.wrapAddresses?.[chainId] : fromToken.addresses[chainId];
  const leg1Output = toToken.native ? toToken.wrapAddresses?.[midChainId] : toToken.addresses[midChainId];
  if (!leg1Input || !leg1Output) return null;

  const params1 = new URLSearchParams({
    tradeType: 'exactInput', amount: amountWei, inputToken: leg1Input, outputToken: leg1Output,
    originChainId: chainId, destinationChainId: midChainId,
    depositor: walletAddress || '0x0000000000000000000000000000000000000000', slippage: slippage,
  });
  const ctrl1 = new AbortController();
  const t1 = setTimeout(() => ctrl1.abort(), 6000);
  const res1 = await fetch(`${ACROSS_API}/swap/approval?${params1}`, { signal: ctrl1.signal });
  clearTimeout(t1);
  if (!res1.ok) return null;
  const data1 = await res1.json();

  const midAmount = data1.expectedOutput;
  if (!midAmount) return null;

  // Leg 2: toToken on midChain → toToken on chainId (same token, just bridge back)
  const leg2Input = toToken.native ? toToken.wrapAddresses?.[midChainId] : toToken.addresses[midChainId];
  const leg2Output = toToken.native ? toToken.wrapAddresses?.[chainId] : toToken.addresses[chainId];
  if (!leg2Input || !leg2Output) return null;

  const params2 = new URLSearchParams({
    tradeType: 'exactInput', amount: midAmount, inputToken: leg2Input, outputToken: leg2Output,
    originChainId: midChainId, destinationChainId: chainId,
    depositor: walletAddress || '0x0000000000000000000000000000000000000000', slippage: slippage,
  });
  const ctrl2 = new AbortController();
  const t2 = setTimeout(() => ctrl2.abort(), 6000);
  const res2 = await fetch(`${ACROSS_API}/swap/approval?${params2}`, { signal: ctrl2.signal });
  clearTimeout(t2);
  if (!res2.ok) return null;
  const data2 = await res2.json();

  const outputNum = data2.expectedOutput ? Number(BigInt(data2.expectedOutput)) / 10 ** toToken.decimals : 0;
  const fp = prices[fromToken.symbol] || 0;
  const fee1 = data1.fees?.totalRelayFee?.total ? Number(BigInt(data1.fees.totalRelayFee.total)) / 10 ** fromToken.decimals : 0;
  const fee2 = data2.fees?.totalRelayFee?.total ? Number(BigInt(data2.fees.totalRelayFee.total)) / 10 ** toToken.decimals : 0;
  const tp = prices[toToken.symbol] || 0;
  const totalFeeUsd = fee1 * fp + fee2 * tp;
  const chainName = CHAINS.find(c => c.id === chainId)?.name || chainId;

  return {
    outputNum,
    provider: `Across via ${midName}`,
    route: `${fromToken.symbol}(${chainName}) → ${midName} → ${toToken.symbol}(${chainName})`,
    feeDisplay: `~$${fmtNum(totalFeeUsd)}`,
    time: '~4 seconds',
    type: 'double-bridge',
    quote: { leg1: data1, leg2: data2, midChainId },
  };
}

function startCountdown(seconds) {
  clearTimeout(txRedirectTimer);
  clearInterval(txCountdownInterval);
  const bar = document.getElementById('tx-countdown-bar');
  const text = document.getElementById('tx-countdown-text');
  let remaining = seconds;
  bar.style.width = '100%';
  text.textContent = `Returning to dashboard in ${remaining}s`;

  txCountdownInterval = setInterval(() => {
    remaining--;
    const pct = Math.max(0, (remaining / seconds) * 100);
    bar.style.width = pct + '%';
    text.textContent = `Returning to dashboard in ${remaining}s`;
    if (remaining <= 0) clearInterval(txCountdownInterval);
  }, 1000);

  txRedirectTimer = setTimeout(() => {
    window.location.href = 'index.html';
  }, seconds * 1000);
}

  clearTimeout(txRedirectTimer);

async function executeSwap() {
  if (!walletAddress) { connectWallet(); return; }
  const amount = parseFloat(document.getElementById('input-amount').value) || 0;
  if (amount <= 0) return;

  const fromSym = TOKENS[fromTokenIdx].symbol;
  const toSym = TOKENS[toTokenIdx].symbol;
  const fromChainName = CHAINS[fromChainIdx].name;
  const toChainName = CHAINS[toChainIdx].name;

  try {
    if (!lastQuote) await fetchBestQuote(amount);
    if (!lastQuote) throw new Error('Could not get quote');
    const routeType = lastQuote._routeType;
    const provider = lastQuote._provider;

    if (routeType === 'uniswap') {
      // Uniswap same-chain swap
      showTxScreen('Confirm in wallet...', `${amount} ${fromSym} → ${toSym} via Uniswap`, false);
      document.getElementById('tx-timer').textContent = '';
      const q = lastQuote;
      // Build swap tx via Universal Router
      // For native ETH input, send value; for ERC20, need approval first
      const fromToken = TOKENS[fromTokenIdx];
      if (!fromToken.native) {
        // Check allowance and approve if needed
        showTxScreen('Approving...', `Approve ${fromSym}`, false);
        document.getElementById('tx-timer').textContent = '';
        await ensureApproval(q.tokenIn, UNI_ROUTER, q.amountWei, q.chainId);
      }
      showTxScreen('Confirm in wallet...', `${amount} ${fromSym} → ${toSym}`, false);
      document.getElementById('tx-timer').textContent = '';
      const hash = await executeUniswapSwap(q);
      showTxScreen('Swapping...', `via Uniswap on ${fromChainName}`, true);
      // Wait for tx confirmation
      await waitForTx(hash, q.chainId);
      const elapsed = (Date.now() - txStartTime) / 1000;
      showTxSuccess(`${amount} ${fromSym} → ${toSym} on ${fromChainName}`, elapsed, hash, q.chainId);

    } else if (routeType === 'across') {
      // Standard Across bridge
      if (lastQuote.approvalTxns?.length) {
        showTxScreen('Approving...', `Approve ${fromSym} for bridging`, false);
        document.getElementById('tx-timer').textContent = '';
        for (const tx of lastQuote.approvalTxns) { await sendTx(tx); }
      }
      showTxScreen('Confirm in wallet...', `${amount} ${fromSym} → ${toSym}`, false);
      document.getElementById('tx-timer').textContent = '';
      const hash = await sendTx(lastQuote.swapTx);
      showTxScreen('Bridging...', `${fromChainName} → ${toChainName} via Across`, true);
      await pollFill(CHAINS[fromChainIdx].id, hash);
      const elapsed = (Date.now() - txStartTime) / 1000;
      showTxSuccess(`${amount} ${fromSym} on ${fromChainName} → ${toSym} on ${toChainName}`, elapsed, hash, CHAINS[fromChainIdx].id);

    } else if (routeType === 'double-bridge') {
      const { leg1, leg2, midChainId } = lastQuote;
      const midName = CHAINS.find(c => c.id === midChainId)?.name || midChainId;
      // Leg 1 approvals
      if (leg1.approvalTxns?.length) {
        showTxScreen('Approving...', `Approve ${fromSym} (leg 1)`, false);
        document.getElementById('tx-timer').textContent = '';
        for (const tx of leg1.approvalTxns) { await sendTx(tx); }
      }
      showTxScreen('Confirm in wallet...', `Leg 1: ${fromChainName} → ${midName}`, false);
      document.getElementById('tx-timer').textContent = '';
      const hash1 = await sendTx(leg1.swapTx);
      showTxScreen('Bridging leg 1...', `${fromChainName} → ${midName}`, true);
      await pollFill(CHAINS[fromChainIdx].id, hash1);
      // Leg 2
      if (leg2.approvalTxns?.length) {
        showTxScreen('Approving...', `Approve for leg 2`, false);
        for (const tx of leg2.approvalTxns) { await sendTx(tx); }
      }
      showTxScreen('Confirm in wallet...', `Leg 2: ${midName} → ${toChainName}`, false);
      const hash2 = await sendTx(leg2.swapTx);
      showTxScreen('Bridging leg 2...', `${midName} → ${toChainName}`, false);
      await pollFill(midChainId, hash2);
      const elapsed = (Date.now() - txStartTime) / 1000;
      showTxSuccess(`${amount} ${fromSym} → ${toSym} on ${toChainName} via ${midName}`, elapsed, hash1, CHAINS[fromChainIdx].id);
    }
  } catch (e) {
    console.error('Tx failed:', e);
    closeTxScreen();
    const btn = document.getElementById('action-btn');
    btn.textContent = e.code === 4001 ? 'Rejected' : 'Failed';
    setTimeout(() => updateActionBtn(), 2000);
  }
}

async function sendTx(tx) {
  // Switch chain if needed
  const targetChainHex = '0x' + tx.chainId.toString(16);
  const currentChain = await window.ethereum.request({ method: 'eth_chainId' });
  if (currentChain !== targetChainHex) {
    try {
      await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: targetChainHex }] });
    } catch (e) {
      if (e.code === 4902) throw new Error(`Please add chain ${tx.chainId} to MetaMask`);
      throw e;
    }
  }

  const txHash = await window.ethereum.request({
    method: 'eth_sendTransaction',
    params: [{
      from: walletAddress,
      to: tx.to,
      data: tx.data,
      value: tx.value && tx.value !== '0' ? '0x' + BigInt(tx.value).toString(16) : '0x0',
      chainId: targetChainHex,
    }],
  });
  return txHash;
}

async function ensureApproval(tokenAddr, spender, amountWei, chainId) {
  // Check current allowance
  const owner = walletAddress;
  const allowanceData = '0xdd62ed3e' + owner.slice(2).padStart(64,'0') + spender.slice(2).padStart(64,'0');
  const chainHex = '0x' + chainId.toString(16);
  const allowance = await window.ethereum.request({
    method: 'eth_call', params: [{ to: tokenAddr, data: allowanceData }, 'latest'],
  });
  if (BigInt(allowance || '0x0') >= BigInt(amountWei)) return; // already approved
  // Send approval tx
  const approveData = '0x095ea7b3' + spender.slice(2).padStart(64,'0') + BigInt(amountWei).toString(16).padStart(64,'0');
  await window.ethereum.request({
    method: 'eth_sendTransaction',
    params: [{ from: owner, to: tokenAddr, data: approveData, chainId: chainHex }],
  });
}

async function executeUniswapSwap(q) {
  // Use exactInputSingle on SwapRouter02: 0x414bf389
  const sel = '0x414bf389';
  const pad = (v) => v.replace('0x','').padStart(64,'0');
  const deadline = Math.floor(Date.now() / 1000) + 1800;
  const fromToken = TOKENS[fromTokenIdx];
  // Encode params tuple: tokenIn, tokenOut, fee, recipient, deadline, amountIn, amountOutMin, sqrtPriceLimitX96
  const amountOutMin = BigInt(BigInt(q.outputWei) * 95n / 100n); // 5% slippage guard
  const data = sel
    + pad(q.tokenIn) + pad(q.tokenOut)
    + pad(BigInt(q.fee).toString(16))
    + pad(walletAddress)
    + pad(BigInt(deadline).toString(16))
    + pad(BigInt(q.amountWei).toString(16))
    + pad(amountOutMin.toString(16))
    + pad('0');

  const chainHex = '0x' + q.chainId.toString(16);
  const SWAP_ROUTER = '0xE592427A0AEce92De3Edee1F18E0157C05861564'; // SwapRouter (deployed everywhere)
  const value = fromToken.native ? '0x' + BigInt(q.amountWei).toString(16) : '0x0';

  return window.ethereum.request({
    method: 'eth_sendTransaction',
    params: [{ from: walletAddress, to: SWAP_ROUTER, data, value, chainId: chainHex }],
  });
}

async function waitForTx(hash, chainId) {
  const chainHex = '0x' + chainId.toString(16);
  for (let i = 0; i < 60; i++) {
    const receipt = await window.ethereum.request({
      method: 'eth_getTransactionReceipt', params: [hash],
    });
    if (receipt && receipt.status) return receipt;
    await new Promise(r => setTimeout(r, 2000));
  }
}

async function pollFill(originChainId, txHash) {
  for (let i = 0; i < 120; i++) {
    try {
      const res = await fetch(`${ACROSS_API}/deposit/status?originChainId=${originChainId}&depositTxHash=${txHash}`);
      const data = await res.json();
      if (data.status === 'filled') return;
    } catch {}
    await new Promise(r => setTimeout(r, 2000));
  }
}

// ── Helpers ──
function fmtNum(n) {
  if (n >= 1000) return n.toLocaleString('en-US', { maximumFractionDigits: 2 });
  if (n >= 1) return n.toLocaleString('en-US', { maximumFractionDigits: 4 });
  return n.toLocaleString('en-US', { maximumFractionDigits: 6 });
}

// ── Load Across routes dynamically ──
async function loadRoutes() {
  try {
    const res = await fetch('/api/routes');
    if (!res.ok) return;
    const { chains, tokens, routes } = await res.json();

    // Enrich TOKENS with any new tokens from Across that we don't have
    if (Array.isArray(tokens)) {
      for (const t of tokens) {
        const existing = TOKENS.find(x => x.symbol === t.symbol);
        if (existing) {
          // Add any new chain addresses
          if (t.chainId && t.address) {
            existing.addresses[t.chainId] = t.address;
          }
        } else if (t.symbol && t.address && t.chainId) {
          // New token we didn't have
          const newToken = {
            symbol: t.symbol,
            name: t.name || t.symbol,
            decimals: t.decimals || 18,
            native: false,
            addresses: { [t.chainId]: t.address },
          };
          TOKENS.push(newToken);
        }
      }
    }

    // Enrich CHAINS
    if (Array.isArray(chains)) {
      for (const c of chains) {
        if (!CHAINS.find(x => x.id === c.chainId)) {
          CHAINS.push({
            id: c.chainId,
            name: c.name || `Chain ${c.chainId}`,
            slug: (c.name || '').toLowerCase().replace(/\s+/g, ''),
          });
        }
      }
    }
    console.log(`Loaded ${TOKENS.length} tokens across ${CHAINS.length} chains from Across`);
  } catch (e) {
    console.warn('Could not load Across routes, using defaults:', e);
  }
}

// ── Init ──
(async function init() {
  updateTokenDisplay();
  updateActionBtn();
  await Promise.all([fetchPrices(), loadRoutes()]);
  onAmountChange();

  if (window.ethereum) {

  }
})();
