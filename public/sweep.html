<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sweep - Sage</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script>
tailwind.config = {
  darkMode: "class",
  theme: {
    extend: {
      colors: {
        "outline-variant":"#a3b899","on-surface":"#2f3a33","background":"#faf7f5",
        "on-primary-container":"#2f3a33","on-primary":"#faf7f5","primary":"#667b68",
        "surface-container-lowest":"#ffffff","surface-container-high":"#dde6d5",
        "surface-bright":"#faf7f5","on-background":"#1f2622","on-error":"#faf7f5",
        "outline":"#667b68","error":"#9e422c","surface":"#faf7f5",
        "surface-dim":"#dde6d5","on-surface-variant":"#667b68",
        "surface-container":"#eaefe5","surface-container-low":"#f2f5ef",
        "primary-fixed":"#dde6d5","primary-container":"#dde6d5",
        "error-container":"#f8d3c5","surface-variant":"#dde6d5",
        "surface-container-highest":"#d3deca",
      },
      fontFamily: { "headline":["Outfit"],"body":["Outfit"],"label":["Outfit"] },
      borderRadius: { "DEFAULT":"1rem","lg":"2rem","xl":"3rem","full":"9999px" },
    },
  },
}
</script>
<style>
  body { font-family: 'Outfit', sans-serif; }
  b, strong, .font-bold, .font-extrabold, .font-black, .font-semibold { letter-spacing: 0.01em; }
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
</style>
</head>
<body class="bg-background text-on-surface antialiased min-h-screen flex flex-col">

<header class="w-full max-w-xl mx-auto h-14 flex justify-between items-center px-6 flex-shrink-0">
  <a href="index.html"><img src="sage-wordmark.svg" alt="Sage" class="h-6"/></a>
  <div class="flex items-center gap-3">
    <a href="index.html" class="text-xs font-medium text-on-surface-variant hover:text-primary transition-colors flex items-center gap-1">
      <span class="material-symbols-outlined text-sm">arrow_back</span>Dashboard
    </a>
    <button id="connect-btn" onclick="connectWallet()" class="flex items-center gap-2 px-3 py-1.5 bg-primary text-on-primary rounded-full text-xs font-bold active:scale-95 transition-transform">
      <span class="material-symbols-outlined text-sm">account_balance_wallet</span>
      <span id="connect-label">Connect</span>
    </button>
  </div>
</header>

<main class="w-full max-w-xl mx-auto px-6 py-6 flex-1 pb-32">

  <!-- Title -->
  <div class="mb-6">
    <h1 class="text-2xl font-black text-on-background">Sweep</h1>
    <p class="text-sm text-on-surface-variant mt-1">Consolidate scattered assets into one token on one chain</p>
  </div>

  <!-- Destination -->
  <div class="mb-6">
    <p class="text-xs font-bold text-on-surface-variant uppercase tracking-wider mb-3">Consolidate to</p>
    <div class="flex gap-2 flex-wrap" id="dest-btns"></div>
  </div>

  <!-- Assets list -->
  <div id="assets-section">
    <p class="text-xs font-bold text-on-surface-variant uppercase tracking-wider mb-3">Your assets</p>
    <div id="assets-list">
      <div class="py-12 text-center text-sm text-on-surface-variant">Connect wallet to load your assets</div>
    </div>
  </div>

</main>

<!-- Sticky footer -->
<div class="fixed bottom-0 left-0 right-0 bg-background border-t border-outline-variant/10 px-6 py-4">
  <div class="max-w-xl mx-auto">
    <div class="flex justify-between items-center mb-3">
      <p class="text-sm text-on-surface-variant"><span id="selected-count">0</span> assets selected · ≈ $<span id="selected-total">0</span></p>
      <button onclick="toggleAll()" class="text-xs font-bold text-primary hover:underline" id="toggle-all-btn">Select all</button>
    </div>
    <button id="action-btn" onclick="executeSweep()" class="w-full py-4 bg-surface-container-high text-on-surface-variant rounded-full font-black text-lg transition-colors">
      Connect Wallet
    </button>
  </div>
</div>

<script>
const ACROSS_API = 'https://app.across.to/api';
const TW = 'https://raw.githubusercontent.com/trustwallet/assets/master/blockchains';

const DEST_PRESETS = [
  { label:'USDC · Base',     symbol:'USDC', decimals:6,  chainId:8453,  chainName:'Base',     slug:'base',     address:'0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913' },
  { label:'USDC · Arbitrum', symbol:'USDC', decimals:6,  chainId:42161, chainName:'Arbitrum', slug:'arbitrum', address:'0xaf88d065e77c8cC2239327C5EDb3A432268e5831' },
  { label:'USDC · Ethereum', symbol:'USDC', decimals:6,  chainId:1,     chainName:'Ethereum', slug:'ethereum', address:'0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48' },
];

const CHAINS = [
  { id:1,      name:'Ethereum', slug:'ethereum' },
  { id:42161,  name:'Arbitrum', slug:'arbitrum' },
  { id:8453,   name:'Base',     slug:'base' },
  { id:10,     name:'Optimism', slug:'optimism' },
  { id:137,    name:'Polygon',  slug:'polygon' },
  { id:324,    name:'zkSync',   slug:'zksync%20era' },
  { id:59144,  name:'Linea',    slug:'linea' },
  { id:34443,  name:'Mode',     slug:'mode' },
  { id:81457,  name:'Blast',    slug:'blast' },
  { id:534352, name:'Scroll',   slug:'scroll' },
  { id:7777777,name:'Zora',     slug:'zora' },
  { id:480,    name:'World Chain',slug:'world%20chain' },
  { id:1135,   name:'Lisk',     slug:'lisk' },
  { id:57073,  name:'Ink',      slug:'ink' },
  { id:1868,   name:'Soneium',  slug:'soneium' },
  { id:130,    name:'Unichain', slug:'unichain' },
];

const TOKEN_META = {
  ETH:  { decimals:18, native:true, wrapAddresses:{1:'0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2',42161:'0x82aF49447D8a07e3bd95BD0d56f35241523fBab1',8453:'0x4200000000000000000000000000000000000006',10:'0x4200000000000000000000000000000000000006',324:'0x5AEa5775959fBC2557Cc8789bC1bf90A239D9a91',59144:'0xe5D7C2a44FfDDf6b295A15c148167daaAf5Cf34f',34443:'0x4200000000000000000000000000000000000006',81457:'0x4300000000000000000000000000000000000004',534352:'0x5300000000000000000000000000000000000004',7777777:'0x4200000000000000000000000000000000000006',480:'0x4200000000000000000000000000000000000006',1135:'0x4200000000000000000000000000000000000006',57073:'0x4200000000000000000000000000000000000006',1868:'0x4200000000000000000000000000000000000006',130:'0x4200000000000000000000000000000000000006' }},
  USDC: { decimals:6,  native:false, addresses:{1:'0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48',42161:'0xaf88d065e77c8cC2239327C5EDb3A432268e5831',8453:'0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913',10:'0x0b2C639c533813f4Aa9D7837CAf62653d097Ff85',137:'0x3c499c542cEF5E3811e1192ce70d8cC03d5c3359' }},
  USDT: { decimals:6,  native:false, addresses:{1:'0xdAC17F958D2ee523a2206206994597C13D831ec7',42161:'0xFd086bC7CD5C481DCC9C85ebE478A1C0b69FCbb9',10:'0x94b008aA00579c1307B0EF2c499aD98a8ce58e58' }},
  WBTC: { decimals:8,  native:false, addresses:{1:'0x2260FAC5E5542a773Aa44fBCfeDf7C193bc2C599',42161:'0x2f2a2543B76A4166549F7aaB2e75Bef0aefC5B0f' }},
  DAI:  { decimals:18, native:false, addresses:{1:'0x6B175474E89094C44Da98b954EedeAC495271d0F',42161:'0xDA10009cBd5D07dd0CeCc66161FC93D7c9000da1' }},
  WETH: { decimals:18, native:false, addresses:{1:'0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2',42161:'0x82aF49447D8a07e3bd95BD0d56f35241523fBab1',8453:'0x4200000000000000000000000000000000000006',10:'0x4200000000000000000000000000000000000006' }},
  UMA:  { decimals:18, native:false, addresses:{1:'0x04Fa0d235C4abf4BcF4787aF4CF447DE572eF828',42161:'0xd693Ec944A85eeca4247eC1c3b130DCa9B0C3b22',10:'0xE7798f023fC62146e8Aa1b36Da45fb70855a77Ea',137:'0x3066818837c5e6eD6601bd5a91B0762a89fB4EB5' }},
  ACX:  { decimals:18, native:false, addresses:{1:'0x44108f0223A3C3028F5Fe7AEC7f9bb2E66beF82F',42161:'0x53691596d1BCe8CEa565b3fBC4d3b90d8b025213',10:'0xFf733b2A3557a7ed6697007ab5D11B79FdD1b76B',137:'0xF328b73B6c685831F238c30a23Fc19140CB4D8FC' }},
  POL:  { decimals:18, native:true,  wrapAddresses:{137:'0x0d500B1d8E8eF31E21C99d1Db9A6444d3ADf1270' }},
};

const TOKEN_ICONS = {
  ETH:'https://raw.githubusercontent.com/trustwallet/assets/master/blockchains/ethereum/assets/0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2/logo.png',
  WETH:'https://raw.githubusercontent.com/trustwallet/assets/master/blockchains/ethereum/assets/0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2/logo.png',
  USDC:'https://raw.githubusercontent.com/trustwallet/assets/master/blockchains/ethereum/assets/0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48/logo.png',
  USDT:'https://raw.githubusercontent.com/trustwallet/assets/master/blockchains/ethereum/assets/0xdAC17F958D2ee523a2206206994597C13D831ec7/logo.png',
  DAI:'https://raw.githubusercontent.com/trustwallet/assets/master/blockchains/ethereum/assets/0x6B175474E89094C44Da98b954EedeAC495271d0F/logo.png',
  WBTC:'https://raw.githubusercontent.com/trustwallet/assets/master/blockchains/ethereum/assets/0x2260FAC5E5542a773Aa44fBCfeDf7C193bc2C599/logo.png',
  UMA:'https://raw.githubusercontent.com/trustwallet/assets/master/blockchains/ethereum/assets/0x04Fa0d235C4abf4BcF4787aF4CF447DE572eF828/logo.png',
  ACX:'https://raw.githubusercontent.com/trustwallet/assets/master/blockchains/ethereum/assets/0x44108f0223A3C3028F5Fe7AEC7f9bb2E66beF82F/logo.png',
  POL:'https://raw.githubusercontent.com/trustwallet/assets/master/blockchains/polygon/info/logo.png',
};
function chainIcon(slug){return `https://icons.llamao.fi/icons/chains/rsz_${slug}.jpg`;}

let walletAddress=null, cachedBalances=null, prices={}, sweepItems=[], destIdx=0;

// ── Dest buttons ──
function renderDestBtns(){
  document.getElementById('dest-btns').innerHTML=DEST_PRESETS.map((d,i)=>`
    <button onclick="setDest(${i})" id="dest-btn-${i}" class="px-4 py-2 rounded-full text-sm font-bold transition-colors ${i===destIdx?'bg-primary text-on-primary':'bg-surface-container text-on-surface-variant hover:bg-surface-container-high'}">
      ${d.label}
    </button>`).join('');
}
function setDest(i){ destIdx=i; renderDestBtns(); buildSweepItems(); }

// ── Wallet ──
async function connectWallet(){
  if(!window.ethereum){alert('Install MetaMask');return;}
  const accs=await window.ethereum.request({method:'eth_requestAccounts'});
  walletAddress=accs[0];
  document.getElementById('connect-label').textContent=walletAddress.slice(0,6)+'...'+walletAddress.slice(-4);
  resolveWalletENS();
  loadBalances();
}

async function loadBalances(){
  if(!walletAddress)return;
  document.getElementById('assets-list').innerHTML='<div class="py-8 text-center text-sm text-on-surface-variant flex items-center justify-center gap-2"><div class="w-4 h-4 rounded-full border-2 border-primary border-t-transparent animate-spin"></div>Loading balances...</div>';
  try{
    const [bRes,pRes]=await Promise.all([
      fetch(`/api/balances?address=${walletAddress}&_t=${Date.now()}`),
      fetch('/api/prices'),
    ]);
    cachedBalances=await bRes.json();
    const raw=await pRes.json();
    prices={ETH:raw.ethereum?.usd||0,WETH:raw.ethereum?.usd||0,WBTC:raw['wrapped-bitcoin']?.usd||0,USDC:1,USDT:1,DAI:1,POL:raw['polygon-ecosystem-token']?.usd||raw['matic-network']?.usd||0,UMA:raw.uma?.usd||0,ACX:raw['across-protocol']?.usd||0};
    buildSweepItems();
  }catch(e){document.getElementById('assets-list').innerHTML='<div class="py-8 text-center text-sm text-error">Failed to load balances</div>';}
}

function buildSweepItems(){
  if(!cachedBalances){renderAssets();updateSummary();return;}
  const dest=DEST_PRESETS[destIdx];
  sweepItems=[];
  for(const [chainId,tokens] of Object.entries(cachedBalances)){
    const cid=Number(chainId);
    const chain=CHAINS.find(c=>c.id===cid);
    if(!chain)continue;
    for(const [symbol,amount] of Object.entries(tokens)){
      if(!amount||amount<=0)continue;
      // Skip if already dest token on dest chain
      if(cid===dest.chainId&&symbol===dest.symbol)continue;
      const meta=TOKEN_META[symbol];
      if(!meta)continue;
      const inputAddr=meta.native?meta.wrapAddresses?.[cid]:meta.addresses?.[cid];
      if(!inputAddr)continue;
      const price=prices[symbol]||0;
      const usdValue=amount*price;
      if(usdValue<0.5)continue; // skip dust
      sweepItems.push({symbol,amount,chainId:cid,chainName:chain.name,chainSlug:chain.slug,meta,inputAddr,usdValue,selected:true,done:false,failed:false});
    }
  }
  sweepItems.sort((a,b)=>b.usdValue-a.usdValue);
  renderAssets();
  updateSummary();
}

function toggleItem(idx){
  sweepItems[idx].selected=!sweepItems[idx].selected;
  renderAssets();
  updateSummary();
}

function toggleAll(){
  const anySelected=sweepItems.some(i=>i.selected&&!i.done);
  sweepItems.forEach(i=>{if(!i.done)i.selected=!anySelected;});
  renderAssets();
  updateSummary();
}

function renderAssets(){
  const list=document.getElementById('assets-list');
  if(!sweepItems.length){
    list.innerHTML='<div class="py-8 text-center text-sm text-on-surface-variant">'+(walletAddress?'No bridgeable assets found':'Connect wallet to load your assets')+'</div>';
    return;
  }
  list.innerHTML=sweepItems.map((item,idx)=>{
    const icon=TOKEN_ICONS[item.symbol]||'';
    const cicon=chainIcon(item.chainSlug);
    const stateClass=item.done?'opacity-60':item.failed?'opacity-60':'';
    const checkClass=item.selected&&!item.done?'bg-primary border-primary':'bg-white border-outline-variant/30';
    return `<button onclick="${item.done||item.failed?'':(`toggleItem(${idx})`)}" class="w-full flex items-center gap-3 px-4 py-3.5 rounded-2xl mb-2 bg-surface-container-lowest border border-outline-variant/10 text-left transition-colors hover:border-primary/20 ${stateClass}">
      <div class="relative flex-shrink-0">
        <img src="${icon}" class="w-10 h-10 rounded-full bg-surface-container" onerror="this.style.display='none'"/>
        <img src="${cicon}" class="w-5 h-5 rounded-full absolute -bottom-0.5 -right-0.5 border-2 border-white"/>
      </div>
      <div class="flex-1 min-w-0">
        <p class="font-bold text-sm text-on-background">${fmt(item.amount)} ${item.symbol}</p>
        <p class="text-xs text-on-surface-variant">${item.chainName} · ≈$${fmt(item.usdValue)}</p>
      </div>
      ${item.done?'<span class="material-symbols-outlined text-primary text-lg">check_circle</span>':
        item.failed?'<span class="material-symbols-outlined text-error text-lg">error</span>':
        `<div class="w-5 h-5 rounded-md border-2 flex items-center justify-center flex-shrink-0 ${checkClass}">
          ${item.selected?'<span class="material-symbols-outlined text-on-primary text-sm">check</span>':''}
        </div>`}
    </button>`;
  }).join('');
}

function updateSummary(){
  const sel=sweepItems.filter(i=>i.selected&&!i.done);
  document.getElementById('selected-count').textContent=sel.length;
  document.getElementById('selected-total').textContent=fmt(sel.reduce((s,i)=>s+i.usdValue,0));
  document.getElementById('toggle-all-btn').textContent=sel.length>0?'Deselect all':'Select all';
  updateBtn();
}

function updateBtn(){
  const btn=document.getElementById('action-btn');
  const sel=sweepItems.filter(i=>i.selected&&!i.done);
  if(!walletAddress){btn.textContent='Connect Wallet';btn.className='w-full py-4 bg-primary text-on-primary rounded-full font-black text-lg active:scale-[0.98] transition-transform';}
  else if(!sel.length){btn.textContent='Select assets to sweep';btn.className='w-full py-4 bg-surface-container-high text-on-surface-variant rounded-full font-black text-lg';}
  else{
    const dest=DEST_PRESETS[destIdx];
    btn.textContent=`Sweep ${sel.length} asset${sel.length>1?'s':''} → ${dest.label}`;
    btn.className='w-full py-4 bg-primary text-on-primary rounded-full font-black text-lg active:scale-[0.98] transition-transform';
  }
}

async function executeSweep(){
  if(!walletAddress){connectWallet();return;}
  const sel=sweepItems.filter(i=>i.selected&&!i.done);
  if(!sel.length)return;
  const dest=DEST_PRESETS[destIdx];
  const btn=document.getElementById('action-btn');
  btn.disabled=true;

  for(let i=0;i<sel.length;i++){
    const item=sel[i];
    btn.textContent=`Bridge ${i+1}/${sel.length}: ${item.symbol} on ${item.chainName}...`;
    try{
      const amountWei=BigInt(Math.floor(item.amount*10**item.meta.decimals)).toString();
      const params=new URLSearchParams({
        tradeType:'exactInput',amount:amountWei,
        inputToken:item.inputAddr,outputToken:dest.address,
        originChainId:item.chainId,destinationChainId:dest.chainId,
        depositor:walletAddress,recipient:walletAddress,slippage:'auto',
      });
      const ctrl=new AbortController();
      const t=setTimeout(()=>ctrl.abort(),10000);
      const res=await fetch(`${ACROSS_API}/swap/approval?${params}`,{signal:ctrl.signal});
      clearTimeout(t);
      if(!res.ok){item.failed=true;renderAssets();continue;}
      const quote=await res.json();
      if(quote.approvalTxns?.length){
        btn.textContent=`Approving ${item.symbol}...`;
        for(const tx of quote.approvalTxns) await sendTx(tx);
      }
      btn.textContent=`Confirm bridge ${i+1}/${sel.length} in wallet...`;
      await sendTx(quote.swapTx);
      item.done=true;
      // save to history
      try{const k='sage_tx_'+(walletAddress||'').toLowerCase();const h=JSON.parse(localStorage.getItem(k)||'[]');h.unshift({type:'bridge',summary:`Sweep: ${fmt(item.amount)} ${item.symbol} → ${dest.symbol}`,fromToken:item.symbol,toToken:dest.symbol,fromChain:item.chainName,toChain:dest.chainName,fromChainId:item.chainId,amount:String(item.amount),timestamp:Date.now(),txHash:null,time:0});if(h.length>20)h.length=20;localStorage.setItem(k,JSON.stringify(h));}catch{}
    }catch(e){
      if(e.code===4001)break; // user rejected — stop
      item.failed=true;
    }
    renderAssets();
    updateSummary();
  }

  btn.disabled=false;
  const remaining=sweepItems.filter(i=>i.selected&&!i.done&&!i.failed).length;
  btn.textContent=remaining?`${remaining} remaining`:'All done!';
  btn.className='w-full py-4 bg-primary text-on-primary rounded-full font-black text-lg active:scale-[0.98] transition-transform';
  if(!remaining) setTimeout(updateBtn,3000);
}

async function sendTx(tx){
  const hex='0x'+tx.chainId.toString(16);
  const cur=await window.ethereum.request({method:'eth_chainId'});
  if(cur!==hex){
    try{await window.ethereum.request({method:'wallet_switchEthereumChain',params:[{chainId:hex}]});}
    catch(e){if(e.code===4902)throw new Error('Add chain to wallet');throw e;}
  }
  const params={from:walletAddress,to:tx.to,data:tx.data,value:tx.value&&tx.value!=='0'?'0x'+BigInt(tx.value).toString(16):'0x0',chainId:hex};
  if(tx.gas)params.gas='0x'+BigInt(tx.gas).toString(16);
  return window.ethereum.request({method:'eth_sendTransaction',params:[params]});
}

function resolveWalletENS(){if(!walletAddress)return;fetch(`/api/ens?address=${walletAddress}`).then(r=>r.json()).then(d=>{if(d.name)document.getElementById('connect-label').textContent=d.name;}).catch(()=>{});}
function fmt(n){if(n>=1000)return n.toLocaleString('en-US',{maximumFractionDigits:2});if(n>=1)return n.toLocaleString('en-US',{maximumFractionDigits:4});return n.toLocaleString('en-US',{maximumFractionDigits:6});}

(async function(){
  renderDestBtns();
  updateBtn();
  if(window.ethereum){
    const accs=await window.ethereum.request({method:'eth_accounts'});
    if(accs.length>0){walletAddress=accs[0];document.getElementById('connect-label').textContent=walletAddress.slice(0,6)+'...'+walletAddress.slice(-4);resolveWalletENS();loadBalances();}
    window.ethereum.on('accountsChanged',a=>{walletAddress=a[0]||null;document.getElementById('connect-label').textContent=walletAddress?walletAddress.slice(0,6)+'...'+walletAddress.slice(-4):'Connect';if(walletAddress)loadBalances();else{sweepItems=[];renderAssets();updateSummary();}});
  }
})();
</script>
</body>
